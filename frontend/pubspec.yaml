name: happy_live
description: Happy Live cross-platform social application.
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.3.2
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  country_picker: ^2.0.27
  http: ^1.2.2
  google_sign_in: ^6.2.2
  image_picker: ^1.1.2
  file_picker: ^11.0.3
  image_cropper: ^12.2.1
  emoji_picker_flutter: ^4.4.0
  web_socket_channel: ^3.0.3
  provider: ^6.1.2
  agora_rtc_engine: ^6.6.4
  permission_handler: ^13.0.2
  world_flags: ^2.1.0
  gif_view: ^1.0.3
  flutter_svga: ^0.0.14
  audioplayers: ^6.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon.PNG
    - assets/images/app_icon2.png.PNG
    - assets/images/boy_headset.png.png
    - assets/images/microphone.PNG
    - assets/images/gift.PNG
    - assets/images/user_level_frame.PNG
    - assets/images/room_level_10_40.PNG
    - assets/images/room_level_40_69.png
    - assets/images/room_level_70_89.png
    - assets/images/room_level_90_104.png
    - assets/images/room_level_105_119.png
    - assets/images/room_background/happy_live_room_bg.png.PNG
    - assets/levels/
    - web/assets/south-arabia-new.png
    - web/assets/images/profile_cover/profile_cover.jpg.JPG
    - shorebird.yaml

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/app_icon2.png.PNG
  adaptive_icon_background: "#09080D"
  adaptive_icon_foreground: assets/images/app_icon2.png.PNG
  web:
    generate: true
    image_path: assets/images/app_icon.PNG
    background_color: "#09080D"
    theme_color: "#09080D"
