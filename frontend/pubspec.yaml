name: happy_live
description: Happy Live cross-platform social application.
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  country_picker: ^2.0.27
  http: ^1.2.2
  image_picker: ^1.1.2
  image_cropper: ^12.2.1
  emoji_picker_flutter: ^4.4.0
  web_socket_channel: ^3.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/boy_headset.png.png
    - web/assets/south-arabia-v2.png
