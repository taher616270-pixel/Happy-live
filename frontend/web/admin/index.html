<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100d19"><title>Happy Live | الإدارة</title>
<style>
:root{color-scheme:dark;--bg:#0b0911;--panel:#15121e;--line:#30283d;--gold:#e8c77f;--purple:#a982d3;--text:#f7f2fc;--muted:#a69bb3;--green:#73d7a8;--red:#f18491}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}
body{margin:0;background:radial-gradient(ellipse at 78% -15%,rgba(111,73,143,.22),transparent 36%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}

.side-foot{margin-top:auto;padding-top:18px}.logout{width:100%;border:1px solid var(--line);text-align:center}.logout:hover{background:rgba(241,132,145,.09);color:#ffabb4;border-color:rgba(241,132,145,.25)}
.main{padding:32px clamp(18px,3vw,42px);width:100%;min-width:0;height:100%;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#514260 transparent}
.dashboard-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 13px}.dashboard-head h2{font-size:18px;margin:0 0 4px}.dashboard-head p{font-size:12px;margin:0}.dashboard-actions{display:flex;gap:7px;flex-wrap:wrap}.dashboard-actions .action{font-size:12px;padding:7px 10px}.dashboard-stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:12px 0}.dashboard-stat{min-width:0;display:flex;align-items:center;gap:12px;padding:16px;background:linear-gradient(145deg,rgba(29,24,40,.96),rgba(21,18,30,.96));border:1px solid var(--line);border-radius:16px}.dashboard-stat-icon{width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;background:#282033;border:1px solid var(--line);border-radius:12px;color:var(--gold);font-size:22px}.dashboard-stat-copy{min-width:0;display:grid;gap:4px}.dashboard-stat-copy strong{color:var(--gold);font-size:23px;line-height:1.15}.dashboard-stat-copy span{color:var(--muted);font-size:12px;line-height:1.5}.dashboard-section{margin-top:12px}.dashboard-chart{min-height:175px;display:flex;align-items:flex-end;justify-content:space-around;gap:10px;padding:12px 6px 0}.dashboard-bar-item{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:170px}.dashboard-bar-item b{font-size:11px;color:var(--muted)}.dashboard-bar{width:min(42px,70%);min-height:4px;background:linear-gradient(180deg,var(--gold),var(--purple));border-radius:7px 7px 2px 2px}.dashboard-bar-item span{font-size:11px;color:var(--muted)}.dashboard-avatar{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:50%;background:#282033;color:var(--gold)}.dashboard-count{display:inline-block;padding:4px 10px;border-radius:20px;background:#30263c;color:var(--gold);font-weight:700}@media(max-width:900px){.dashboard-stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.dashboard-head{align-items:flex-start;flex-direction:column}.dashboard-stats-grid{gap:8px}.dashboard-stat{padding:12px;gap:8px}.dashboard-stat-icon{width:38px;height:38px;flex-basis:38px}.dashboard-stat-copy strong{font-size:19px}.dashboard-stat-copy span{font-size:11px}}.gift-tab-panel{display:none}.gift-tab-panel.active{display:block}.gifts-tabs{width:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:thin}.gifts-tabs button{flex:0 0 auto}.dashboard-tabs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 16px;padding:7px;background:#100d17;border:1px solid var(--line);border-radius:12px;width:max-content;max-width:100%}.dashboard-tabs button{border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:8px;font-size:12px;line-height:1.3;white-space:nowrap}.dashboard-tabs button.active{background:linear-gradient(100deg,#e7c77f,#b38bd7);color:#21172a;font-weight:800}.dashboard-tabs button:hover:not(.active){background:#282033;color:var(--text)}
.menu-toggle{display:none}.top,.section-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:24px}.top{padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,.07)}
.top h1{margin:0;font-size:26px}.top small{display:block;margin-top:7px}.badge{padding:7px 11px;border-radius:30px;background:#30263c;font-size:11px;white-space:nowrap}.good{color:var(--green)}.bad{color:var(--red)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.card,.section{background:linear-gradient(145deg,rgba(29,24,40,.96),rgba(21,18,30,.96));border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:0 10px 30px rgba(0,0,0,.10)}
.card{min-height:125px;position:relative;overflow:hidden}.card:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(169,130,211,.07);left:-28px;bottom:-42px}
.card span{color:var(--muted);font-size:13px}.card strong{display:block;color:var(--gold);font-size:30px;margin-top:13px;font-weight:800}
.section{margin-bottom:18px}.section h2{font-size:18px;margin:0}.section p{line-height:1.8}.search{max-width:300px;padding:11px 13px}
.table-wrap{overflow:auto;border:1px solid rgba(255,255,255,.05);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:650px}
td,th{padding:14px 13px;text-align:right;border-bottom:1px solid #30263c;font-size:13px;white-space:nowrap}th{color:var(--muted);font-weight:600;background:rgba(255,255,255,.025)}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:rgba(255,255,255,.025)}
.action{padding:8px 12px;border:1px solid #4a3b5b;border-radius:9px;background:#342744;color:#eee}.action:hover{filter:brightness(1.18)}.danger{background:#48232f;color:#ffb5bd;border-color:#693441}
.notice{padding:16px;border:1px solid #594a34;background:#2b2419;color:#e8d5a7;border-radius:13px}.empty,.loading{text-align:center;padding:30px;color:var(--muted)}
.room-tools{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.room-tools .action{font-size:12px;padding:7px 10px}.room-tools .search{width:min(100%,360px);min-width:220px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px;align-items:end}
.form-grid>label{display:grid;gap:8px;min-width:0;color:#ded5e8;font-size:13px}

@media(max-width:1050px){.app{grid-template-columns:225px minmax(0,1fr)}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:25px 22px}}
@media(max-width:700px){.app{display:flex;flex-direction:column;height:100dvh;min-height:0;overflow:hidden}.side{height:100dvh;width:85vw;max-width:none;flex:0 0 auto;position:fixed;z-index:30;top:0;right:0;bottom:0;padding:22px 16px 18px;border-left:1px solid var(--line);border-bottom:0;box-shadow:-14px 0 38px rgba(0,0,0,.42);transform:translateX(105%);transition:transform .25s ease;overflow-y:auto}.side.drawer-open{transform:translateX(0)}.brand{padding:4px 8px 22px;margin-bottom:18px;border-bottom:1px solid rgba(255,255,255,.06)}.brand .logo{width:42px;height:42px;font-size:22px;border-radius:13px}.brand b{font-size:13px}.brand small{font-size:11px}.nav{display:grid;gap:8px;overflow:visible}.nav button{width:100%;white-space:nowrap;padding:13px 14px;font-size:14px}.side-foot{display:block;margin-top:auto;padding-top:20px}.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:25;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}.drawer-overlay.visible{opacity:1;visibility:visible}.main{flex:1 1 auto;height:auto;min-height:0;overflow-y:auto;padding:19px 13px 28px}.top{margin-bottom:17px;padding-bottom:15px}.top h1{font-size:21px}.menu-toggle{display:grid;place-items:center;flex:0 0 44px;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:#211a2c;color:var(--gold);font-size:23px;line-height:1}.top-title{flex:1;min-width:0}.top{justify-content:flex-start}.top>.badge{margin-right:auto}.cards{gap:10px;margin-bottom:13px}.card{padding:15px;min-height:105px;border-radius:15px}.card strong{font-size:24px;margin-top:9px}.card span{font-size:12px}.section{padding:15px;border-radius:15px}.section-head{align-items:flex-start;flex-direction:column;gap:12px}.search{max-width:none}.login{padding:27px 23px}}
@media(max-width:380px){.nav button{padding:8px 9px;font-size:11px}.cards{gap:8px}.card{padding:12px}.card strong{font-size:21px}}

/* Games administration: structured cards and dedicated modal forms */

.game-admin-card-main{display:flex;align-items:center;gap:13px;min-width:0}.game-admin-icon{width:58px;height:58px;flex:0 0 58px;object-fit:cover;border-radius:14px;border:1px solid var(--line)}.game-admin-icon-empty{display:grid;place-items:center;background:#282033;color:var(--gold);font-size:25px}.game-admin-copy{min-width:0}.game-admin-copy h3{margin:0 0 5px;font-size:17px}.game-admin-copy p{margin:0 0 7px;color:var(--muted);font-size:11px;overflow-wrap:anywhere}.game-admin-link{font-size:12px;overflow-wrap:anywhere}.game-admin-link a{color:var(--gold);text-decoration:none}.game-admin-actions{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06)}.game-admin-actions .action{font-size:12px;padding:9px 12px}
.game-empty-state{text-align:center;padding:38px 18px;border:1px dashed #514260;border-radius:16px;background:rgba(29,24,40,.55)}.game-empty-state>div{font-size:34px;color:var(--gold)}.game-empty-state h3{margin:8px 0}.game-empty-state p{color:var(--muted);font-size:13px}.game-empty-state .primary{width:auto;padding:11px 20px}.game-admin-footnote{margin-top:15px;padding:13px 15px;border:1px solid #594a34;background:#2b2419;color:#e8d5a7;border-radius:12px;font-size:12px;line-height:1.8}
.game-modal-backdrop{position:fixed;inset:0;z-index:1000;background:rgba(5,4,9,.78);backdrop-filter:blur(7px);display:grid;place-items:center;padding:18px}.game-modal{width:min(620px,100%);max-height:90%;overflow:auto;background:#171320;border:1px solid #514260;border-radius:20px;box-shadow:0 25px 90px rgba(0,0,0,.6)}.game-modal-wide{width:min(820px,100%)}.game-modal-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:19px 21px;background:#171320;border-bottom:1px solid var(--line)}.game-modal-head h2{margin:0;font-size:19px}.game-modal-head p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.6}.game-modal-x{width:36px;height:36px;flex:0 0 36px;border:1px solid var(--line);border-radius:10px;background:#282033;color:var(--text);font-size:24px;line-height:1}.game-modal-body{padding:18px 21px 22px}.game-form-section{border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px;min-width:0}.game-form-section legend{padding:0 8px;color:var(--gold);font-size:14px;font-weight:800}.game-form-help{margin:0 0 13px;color:var(--muted);font-size:11px;line-height:1.7}.game-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 15px}.game-field{display:grid;gap:7px;min-width:0;color:#e5dceb;font-size:12px}.game-field>span{font-weight:650}.game-field input,.game-field select,.game-field textarea{width:100%;min-width:0;padding:11px 12px;border:1px solid #40354e;border-radius:10px;background:#0e0b14;color:var(--text);font:inherit;outline:none}.game-field input:focus,.game-field select:focus,.game-field textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(169,130,211,.12)}.game-field input:disabled{opacity:.65}.game-field textarea{resize:vertical;line-height:1.7}.game-field small{color:var(--muted);font-size:10px;line-height:1.6}.game-field-wide{grid-column:1/-1}.game-icon-preview{width:78px;height:78px;object-fit:cover;border-radius:13px;border:1px solid var(--line)}.game-modal-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:16px}.game-modal-actions .primary{width:auto;min-width:170px;padding:11px 17px}.game-modal-actions .error{flex:1 1 100%}.game-modal-body .table-wrap{max-width:100%}.game-modal-body table{min-width:720px}.game-key-result{margin-top:16px;padding:14px;border:1px solid rgba(115,215,168,.3);border-radius:12px;background:rgba(115,215,168,.06)}.game-key-result strong{color:var(--green);font-size:13px}.game-key-result textarea{display:block;width:100%;margin:10px 0;padding:12px;border:1px solid var(--line);border-radius:9px;background:#0b0911;color:var(--text);direction:ltr;text-align:left;overflow-wrap:anywhere}

async function uploadPkMedia(file){
  if(!file)return null;
  const ext=(file.name.split(".").pop()||"").toLowerCase();
  if(!["gif","svga"].includes(ext))throw Error("يسمح بملفات GIF أو SVGA فقط.");
  if(file.size<1||file.size>20*1024*1024)throw Error("حجم ملف PK يجب ألا يتجاوز 20MB.");
  const authResponse=await fetch(API+"/imagekit/auth",{headers:{Authorization:"Bearer "+token}});
  const auth=await authResponse.json();
  if(!authResponse.ok||!auth.token||!auth.signature||!auth.expire||!auth.publicKey)throw Error(auth.message||auth.error||"تعذر تجهيز رفع ملف PK.");
  const form=new FormData();form.append("file",file);form.append("fileName",file.name);form.append("publicKey",auth.publicKey);form.append("token",auth.token);form.append("expire",String(auth.expire));form.append("signature",auth.signature);form.append("folder","/happy-live/pk");form.append("useUniqueFileName","true");
  const response=await fetch("https://upload.imagekit.io/api/v1/files/upload",{method:"POST",body:form});
  const result=await response.json();
  if(!response.ok||!result.url||!result.fileId)throw Error(result.message||"فشل رفع ملف PK إلى ImageKit.");
  return {url:result.url,type:ext,fileId:result.fileId};
}

async function uploadCannonImage(file, folder){
  if(!file)return null;
  const allowed=["image/png","image/jpeg","image/webp","image/gif"];
  if(!allowed.includes(file.type)||file.size>10*1024*1024)throw Error("اختر PNG أو JPG أو WEBP أو GIF بحجم لا يتجاوز 10MB.");
  const authResponse=await fetch(API+"/imagekit/auth",{headers:{Authorization:"Bearer "+token}});
  const auth=await authResponse.json();
  if(!authResponse.ok||!auth.token||!auth.signature||!auth.expire||!auth.publicKey)throw Error(auth.message||auth.error||"تعذر تجهيز رفع الصورة.");
  const form=new FormData();
  form.append("file",file);form.append("fileName",file.name);form.append("publicKey",auth.publicKey);
  form.append("token",auth.token);form.append("expire",String(auth.expire));form.append("signature",auth.signature);
  form.append("folder",folder);form.append("useUniqueFileName","true");
  const response=await fetch("https://upload.imagekit.io/api/v1/files/upload",{method:"POST",body:form});
  const result=await response.json();
  if(!response.ok||!result.url||!result.fileId)throw Error("فشل رفع الصورة إلى مكتبة الصور.");
  return result.url;
}

  const uploadAsset=async(inputId,folder,previewId,onDone)=>{
    const input=$(inputId);input.onchange=async()=>{
      const file=input.files&&input.files[0];if(!file)return;
      const preview=$(previewId);preview.textContent="جارٍ رفع الصورة…";

      finally{input.value=""}
    };
  };

  await uploadAsset("cannonFrameFile","/happy-live/cannon/frames","cannonFramePreview",url=>frameImageUrl=url);
  $("cannonLevelEditors").addEventListener("input",event=>{
    const el=event.target,li=Number(el.dataset.level),pi=Number(el.dataset.prize);
    if(el.dataset.levelField){const level=draftLevels[li];level[el.dataset.levelField]=el.dataset.levelField==="need"?Number(el.value):el.value;if(el.dataset.levelField==="title"){const title=el.closest("details")?.querySelector("summary strong");if(title)title.textContent=el.value||("المستوى "+level.level);}}
    if(el.dataset.prizeField&&draftLevels[li]?.prizes?.[pi]){
      const prize=draftLevels[li].prizes[pi],field=el.dataset.prizeField;
      prize[field]=field==="weight"?Number(el.value):field==="top1"||field==="rare"?el.checked:el.value;
    }
  });
  $("cannonLevelEditors").addEventListener("change",event=>{
    const el=event.target,li=Number(el.dataset.level),pi=Number(el.dataset.prize);
    if(el.dataset.levelField){draftLevels[li][el.dataset.levelField]=el.dataset.levelField==="need"?Number(el.value):el.value;}
    if(el.dataset.prizeField&&draftLevels[li]?.prizes?.[pi]){
      const field=el.dataset.prizeField;draftLevels[li].prizes[pi][field]=field==="weight"?Number(el.value):field==="top1"||field==="rare"?el.checked:el.value;
    }
    if(el.dataset.prizeField==="top1"&&el.checked){
      draftLevels[li].prizes.forEach((p,index)=>{if(index!==pi)p.top1=false;});renderLevels();
    }
  });
  $("cannonLevelEditors").addEventListener("click",event=>{
    const add=event.target.closest("[data-add-prize]");
    const remove=event.target.closest("[data-remove-prize]");
    if(add){const li=Number(add.dataset.addPrize);draftLevels[li].prizes.push({key:"reward_l"+draftLevels[li].level+"_"+Date.now().toString(36),name:"مكافأة جديدة",type:"coins",value:"100",icon:"",top1:false,weight:10});renderLevels();return;}
    if(remove){const [li,pi]=remove.dataset.removePrize.split(":").map(Number);if(draftLevels[li].prizes.length<=1){alert("يجب أن يبقى مستوى الجائزة محتويًا على مكافأة واحدة على الأقل.");return;}draftLevels[li].prizes.splice(pi,1);renderLevels();}
  });

    catch(error){if(preview)preview.textContent=error.message||"فشل رفع الصورة."}
    finally{input.value=""}
  });
  $("addCannonLevel").onclick=()=>{

    const previous=draftLevels[draftLevels.length-1];
    const nextNeed=Math.max(1,Math.floor(Number(previous?.need||90000)*2));
    draftLevels.push({level:next,title:"المستوى "+next,need:nextNeed,prizes:[{key:"coins_l"+next,name:"مكافأة المستوى "+next,type:"coins",value:"100",icon:"",top1:false,weight:100}]});

    if($("cannonLevelEditors").lastElementChild){$("cannonLevelEditors").lastElementChild.open=true;$("cannonLevelEditors").lastElementChild.scrollIntoView({behavior:"smooth",block:"start"});}
  };
  $("saveCannonSettings").onclick=async()=>{
    const button=$("saveCannonSettings"),message=$("cannonSettingsMessage");
    const invalid=draftLevels.find((level,index)=>Number(level.level)!==index+1||!Number.isSafeInteger(Number(level.need))||Number(level.need)<1||!Array.isArray(level.prizes)||!level.prizes.length);
    if(invalid){message.textContent="تحقق من تسلسل المستويات وقيمة المساهمة ووجود مكافأة واحدة على الأقل في كل مستوى.";return;}

      await cannonAdminPage();
    }catch(error){message.textContent=error.message||"تعذر حفظ إعدادات المدفع."}
    finally{button.disabled=false}
  };
}

async function loadRoomModeration(roomId,roomName,q=""){
  const root=$("roomModeration");if(!root)return;
  root.innerHTML='<div class="section"><div class="loading">جارٍ تحميل إدارة الغرفة…</div></div>';
  try{
    const endpoint="/admin/rooms/"+encodeURIComponent(roomId)+"/moderation"+(q?"?q="+encodeURIComponent(q):"");
    const data=await api(endpoint);
    const canManage=admin.role==="owner"||admin.role==="admin";
    const actionButton=(action,user,label,danger=false)=>'<button class="action '+(danger?"danger":"")+'" data-room-action="'+action+'" data-user-id="'+esc(user.user_id)+'">'+label+'</button>';
    const userActions=user=>{
      if(!canManage||user.user_id===data.room.ownerUserId)return '<span class="muted">محمي</span>';
      const isModerator=Number(user.is_moderator)===1;
      const isBanned=Number(user.is_banned)===1;
      if(isBanned)return actionButton("unban",user,"رفع الحظر");
      let html=actionButton(isModerator?"remove_moderator":"assign_moderator",user,isModerator?"إزالة المشرف":"تعيين مشرف");
      if(!isModerator){
        if(Number(user.is_seated)===1)html+=actionButton(Number(user.is_muted)===1?"unmute":"mute",user,Number(user.is_muted)===1?"إلغاء الكتم":"كتم");
        html+=actionButton("kick",user,"طرد دقيقة",true)+actionButton("ban",user,"حظر دائم",true);

      return '<div class="room-tools">'+html+'</div>';
    };

    const kickRows=data.kicks.length?data.kicks.map(user=>'<tr><td>'+userName(user)+'</td><td>'+esc(user.happy_id||"—")+'</td><td>'+esc(user.kicked_until||"—")+'</td></tr>').join(""):'<tr><td colspan="3" class="empty">لا يوجد طرد مؤقت نشط</td></tr>';

    '<div class="form-grid"><label>معرّف اللاعب UID<input id="utdTestUid" inputmode="numeric" value="93013793" autocomplete="off"></label>'+
    '<label>نطاق الرمز<input value="UTD callbacks only" readonly></label></div>'+
    '<div class="notice" style="margin-top:14px">الرمز مؤقت ومخصص لاختبارات UTD فقط، ولا يغيّر رصيد اللاعب. إصدار رمز جديد يبطل الرمز السابق.</div>'+
    '<div class="form-actions" style="margin-top:16px"><button class="primary" id="utdIssueToken" type="button">إصدار رمز اختبار</button><span id="utdIssueStatus" class="muted" role="status"></span></div>'+
    '<div id="utdTokenResult"></div></div>';
  $("utdIssueToken").onclick=async()=>{
    const button=$("utdIssueToken"),uid=$("utdTestUid").value.trim();
    $("utdTokenResult").innerHTML="";$("utdIssueStatus").textContent="";
    if(!/^\d{5,20}$/.test(uid)){$("utdIssueStatus").textContent="أدخل UID رقميًا صحيحًا.";return}
    button.disabled=true;button.textContent="جارٍ إصدار الرمز…";
    try{
      const result=await api("/admin/utd/test-session",{method:"POST",body:JSON.stringify({uid})});
      if(!result.test_token||!result.expires_at)throw Error("استجابة الخادم لا تحتوي على رمز الاختبار أو وقت الانتهاء.");
      $("utdTokenResult").innerHTML=
        '<div class="game-key-result"><strong>تم إصدار رمز الاختبار بنجاح</strong>'+
        '<label class="field" style="margin:12px 0 6px">Token الاختبار<textarea id="utdIssuedToken" rows="4" readonly></textarea></label>'+
        '<p class="muted">ينتهي في: <b id="utdExpiresAt"></b></p>'+
        '<p class="muted">النطاق: '+esc(result.scope||"UTD callbacks only")+' · UID: '+esc(uid)+'</p>'+
        '<button class="action" id="utdCopyToken" type="button">نسخ Token الاختبار</button></div>';
      $("utdIssuedToken").value=result.test_token;
      const expiry=new Date(result.expires_at);
      $("utdExpiresAt").textContent=Number.isNaN(expiry.getTime())?result.expires_at:expiry.toLocaleString("ar");
      $("utdCopyToken").onclick=async()=>{
        const field=$("utdIssuedToken");
        try{await navigator.clipboard.writeText(field.value);$("utdCopyToken").textContent="تم النسخ"}
        catch(_){field.focus();field.select();$("utdCopyToken").textContent="حدّد الرمز وانسخه"}
      };
      $("utdIssueStatus").textContent="احتفظ بالرمز في إعدادات منصة UTD فقط.";
    }catch(error){$("utdIssueStatus").textContent=error.message}
    finally{button.disabled=false;button.textContent="إصدار رمز اختبار"}
  };
}

function audit(a){$("content").innerHTML='<div class="section"><div class="section-head"><h2>آخر الإجراءات ('+a.length+')</h2></div><div class="table-wrap"><table><thead><tr><th>الإجراء</th><th>المدير</th><th>النوع</th><th>المعرف</th><th>التاريخ</th></tr></thead><tbody>'+(a.length?a.map(x=>'<tr><td>'+esc(x.action)+'</td><td>'+esc(x.actor_name||x.actor_email||"—")+'</td><td>'+esc(x.target_type)+'</td><td>'+esc(x.target_id)+'</td><td>'+esc(new Date(x.created_at).toLocaleString("ar"))+'</td></tr>').join(""):'<tr><td colspan="5" class="empty">لا توجد إجراءات</td></tr>')+'</tbody></table></div></div>'}
startup();
</script></body></html>
