<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100d19"><title>Happy Live | الإدارة</title>
<style>
:root{color-scheme:dark;--bg:#0b0911;--panel:#15121e;--line:#30283d;--gold:#e8c77f;--purple:#a982d3;--text:#f7f2fc;--muted:#a69bb3;--green:#73d7a8;--red:#f18491}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}
body{margin:0;background:radial-gradient(ellipse at 78% -15%,rgba(111,73,143,.22),transparent 36%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 35%,rgba(119,82,154,.14),transparent 48%)}
.login{width:min(430px,100%);background:linear-gradient(145deg,rgba(31,25,43,.98),rgba(19,16,28,.98));border:1px solid #3a3049;border-radius:26px;padding:34px;box-shadow:0 28px 90px rgba(0,0,0,.38)}
.logo{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(145deg,#f4d99b,#b18ad7);color:#24182e;font-size:29px;font-weight:950;box-shadow:0 8px 24px rgba(199,158,111,.18);margin-bottom:20px}
h1{font-size:25px;letter-spacing:-.4px;margin:0 0 8px}.muted{color:var(--muted)}
.field{display:grid;gap:8px;margin:19px 0;font-size:14px;color:#ded5e8}
.field input,.search{padding:14px 15px;border-radius:13px;border:1px solid #3b304b;background:#0f0c16;color:var(--text);width:100%;outline:none;transition:border-color .18s,box-shadow .18s}
.field input:focus,.search:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(169,130,211,.12)}
.primary{padding:14px;border-radius:13px;background:linear-gradient(100deg,#e7c77f,#b38bd7);color:#21172a;font-weight:850;width:100%;border:0;box-shadow:0 8px 24px rgba(188,148,196,.12)}.primary:disabled{opacity:.6;cursor:wait}.error{color:var(--red);min-height:22px;font-size:13px}
.app{display:grid;grid-template-columns:258px minmax(0,1fr);height:100vh;min-height:560px;overflow:hidden}
.side{background:rgba(18,15,25,.97);border-left:1px solid var(--line);padding:24px 16px;height:100%;position:relative;display:flex;flex-direction:column;z-index:5}
.brand{display:flex;gap:12px;align-items:center;padding:4px 8px 28px;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:22px}
.brand .logo{width:44px;height:44px;font-size:23px;margin:0;border-radius:14px}.brand b{letter-spacing:1.3px;font-size:14px}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.nav{display:grid;gap:7px}.nav button,.logout{padding:13px 14px;background:transparent;color:#b7adbf;border:1px solid transparent;border-radius:12px;text-align:right;font-size:14px;transition:background .18s,color .18s,border-color .18s}
.nav button.active,.nav button:hover{background:linear-gradient(90deg,rgba(169,130,211,.15),rgba(232,199,127,.07));color:var(--gold);border-color:rgba(169,130,211,.18)}
.side-foot{margin-top:auto;padding-top:18px}.logout{width:100%;border:1px solid var(--line);text-align:center}.logout:hover{background:rgba(241,132,145,.09);color:#ffabb4;border-color:rgba(241,132,145,.25)}
.main{padding:32px clamp(18px,3vw,42px);width:100%;min-width:0;height:100%;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#514260 transparent}
.top,.section-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:24px}.top{padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,.07)}
.top h1{margin:0;font-size:26px}.top small{display:block;margin-top:7px}.badge{padding:7px 11px;border-radius:30px;background:#30263c;font-size:11px;white-space:nowrap}.good{color:var(--green)}.bad{color:var(--red)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.card,.section{background:linear-gradient(145deg,rgba(29,24,40,.96),rgba(21,18,30,.96));border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:0 10px 30px rgba(0,0,0,.10)}
.card{min-height:125px;position:relative;overflow:hidden}.card:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(169,130,211,.07);left:-28px;bottom:-42px}
.card span{color:var(--muted);font-size:13px}.card strong{display:block;color:var(--gold);font-size:30px;margin-top:13px;font-weight:800}
.section{margin-bottom:18px}.section h2{font-size:18px;margin:0}.section p{line-height:1.8}.search{max-width:300px;padding:11px 13px}
.table-wrap{overflow:auto;border:1px solid rgba(255,255,255,.05);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:650px}
td,th{padding:14px 13px;text-align:right;border-bottom:1px solid #30263c;font-size:13px;white-space:nowrap}th{color:var(--muted);font-weight:600;background:rgba(255,255,255,.025)}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:rgba(255,255,255,.025)}
.action{padding:8px 12px;border:1px solid #4a3b5b;border-radius:9px;background:#342744;color:#eee}.action:hover{filter:brightness(1.18)}.danger{background:#48232f;color:#ffb5bd;border-color:#693441}
.notice{padding:16px;border:1px solid #594a34;background:#2b2419;color:#e8d5a7;border-radius:13px}.empty,.loading{text-align:center;padding:30px;color:var(--muted)}
@media(max-width:1050px){.app{grid-template-columns:225px minmax(0,1fr)}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:25px 22px}}
@media(max-width:700px){.app{display:flex;flex-direction:column;height:100dvh;min-height:0;overflow:hidden}.side{height:auto;flex:0 0 auto;position:sticky;top:0;padding:10px 12px 9px;border-left:0;border-bottom:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.2)}.brand{padding:0 4px 9px;margin-bottom:8px;border:0}.brand .logo{width:35px;height:35px;font-size:19px;border-radius:11px}.brand b{font-size:12px}.brand small{font-size:10px}.nav{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{flex:0 0 auto;white-space:nowrap;padding:9px 11px;font-size:12px}.side-foot{display:none}.main{flex:1 1 auto;height:auto;min-height:0;overflow-y:auto;padding:19px 13px 28px}.top{margin-bottom:17px;padding-bottom:15px}.top h1{font-size:21px}.cards{gap:10px;margin-bottom:13px}.card{padding:15px;min-height:105px;border-radius:15px}.card strong{font-size:24px;margin-top:9px}.card span{font-size:12px}.section{padding:15px;border-radius:15px}.section-head{align-items:flex-start;flex-direction:column;gap:12px}.search{max-width:none}.login{padding:27px 23px}}
@media(max-width:380px){.nav button{padding:8px 9px;font-size:11px}.cards{gap:8px}.card{padding:12px}.card strong{font-size:21px}}
</style></head><body>
<div id="loginView" class="login-wrap"><form id="setupForm" class="login hidden"><div class="logo">H</div><h1>إنشاء كلمة مرور المدير</h1><p class="muted">إعداد أول مرة لحساب المالك المستقل</p><label class="field">رمز التهيئة لمرة واحدة<input id="setupToken" type="password" autocomplete="off" required></label><label class="field">كلمة المرور الجديدة<input id="setupPassword" type="password" autocomplete="new-password" minlength="12" required></label><label class="field">تأكيد كلمة المرور<input id="setupConfirmation" type="password" autocomplete="new-password" minlength="12" required></label><button class="primary" id="setupBtn">إنشاء كلمة المرور</button><div id="setupError" class="error"></div><p class="muted" style="font-size:12px">استخدم 12 حرفًا على الأقل. لا تشارك كلمة المرور مع أي شخص.</p></form><form id="loginForm" class="login"><div class="logo">H</div><h1>لوحة إدارة Happy Live</h1><p class="muted">دخول المالك المستقل</p><label class="field">اسم المستخدم<input id="username" type="text" autocomplete="username" required></label><label class="field">كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" id="loginBtn">تسجيل الدخول</button><div id="loginError" class="error"></div><p class="muted" style="font-size:12px">حساب الإدارة مستقل عن حسابات مستخدمي التطبيق.</p></form></div>
<div id="appView" class="app hidden"><aside class="side"><div class="brand"><div class="logo">H</div><div><b>HAPPY LIVE</b><small>مركز الإدارة</small></div></div><nav class="nav"><button class="active" data-page="overview">◈　الرئيسية</button><button data-page="stats">▥　الإحصائيات</button><button data-page="users">♙　المستخدمون</button><button data-page="rooms">◉　الغرف الصوتية</button><button data-page="moderators">♙　المشرفون</button><button data-page="audit">▤　سجل الإجراءات</button><button data-page="agora">◉　Agora للصوت</button><button data-page="future">✧　خدمات المنصة</button></nav><div class="side-foot"><button id="logoutBtn" class="logout">تسجيل الخروج</button></div></aside><main class="main"><header class="top"><div><h1 id="pageTitle">نظرة عامة</h1><small id="adminIdentity" class="muted"></small></div><span class="badge good">اتصال آمن</span></header><div id="content"><div class="loading">جارٍ التحميل…</div></div></main></div>
<script>
const API="https://happy-live-api.taher616270.workers.dev/api/v1";let token=sessionStorage.getItem("happy_live_admin_token")||"",admin=null,page="overview";
const $=id=>document.getElementById(id);function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function api(path,opt){opt=opt||{};let r=await fetch(API+path,{method:opt.method||"GET",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:opt.body});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw Error(d.message||d.error||"تعذر تنفيذ الطلب");return d}
function login(msg){$("loginView").classList.remove("hidden");$("appView").classList.add("hidden");$("loginError").textContent=msg||""}

async function startup(){
  try{
    const response=await fetch(API+"/admin/auth/setup-status",{cache:"no-store"});
    const status=await response.json();
    if(!response.ok)throw Error(status.error||"تعذر التحقق من حالة إعداد المدير");
    if(status.setupRequired){
      $("loginForm").classList.add("hidden");
      $("setupForm").classList.remove("hidden");
      $("appView").classList.add("hidden");
      return;
    }
    $("setupForm").classList.add("hidden");
    await verify();
  }catch(e){login(e.message)}
}
$("setupForm").onsubmit=async e=>{
  e.preventDefault();
  const btn=$("setupBtn");btn.disabled=true;$("setupError").textContent="";
  try{
    const response=await fetch(API+"/admin/auth/setup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      setupToken:$("setupToken").value.trim(),
      password:$("setupPassword").value,
      confirmation:$("setupConfirmation").value
    })});
    const data=await response.json();
    if(!response.ok)throw Error(data.message||data.error||"تعذر إنشاء كلمة المرور");
    $("setupForm").classList.add("hidden");
    $("loginForm").classList.remove("hidden");
    $("username").value="owner";
    $("password").value="";
    $("loginError").textContent="تم إنشاء كلمة المرور بنجاح. سجّل الدخول الآن.";
    $("setupToken").value="";$("setupPassword").value="";$("setupConfirmation").value="";
  }catch(error){$("setupError").textContent=error.message}
  finally{btn.disabled=false}
};
function app(){
  $("loginView").classList.add("hidden");$("appView").classList.remove("hidden");
  const roleNames={owner:"مالك",admin:"مدير",moderator:"مشرف للقراءة فقط"};
  $("adminIdentity").textContent=admin.name+" · "+admin.username+" · "+(roleNames[admin.role]||"دور غير معروف");
  const m=document.querySelector('[data-page="moderators"]');if(m)m.classList.toggle("hidden",admin.role!=="owner");
  const a=document.querySelector('[data-page="agora"]');if(a)a.classList.toggle("hidden",admin.role==="moderator");
}
async function verify(){if(!token)return login();try{admin=(await api("/admin/me")).admin;app();await render()}catch(e){token="";sessionStorage.removeItem("happy_live_admin_token");login(e.message)}}
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginBtn").disabled=true;try{let r=await fetch(API+"/admin/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("username").value.trim(),password:$("password").value})});let d=await r.json();if(!r.ok)throw Error(d.message||"بيانات الدخول غير صحيحة");token=d.accessToken;sessionStorage.setItem("happy_live_admin_token",token);admin=(await api("/admin/me")).admin;app();await render()}catch(x){token="";sessionStorage.removeItem("happy_live_admin_token");login(x.message)}finally{$("loginBtn").disabled=false}};
$("logoutBtn").onclick=async()=>{try{await api("/admin/auth/logout",{method:"POST"})}catch(e){}token="";sessionStorage.removeItem("happy_live_admin_token");login()};
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-page]").forEach(x=>x.classList.toggle("active",x===b));page=b.dataset.page;render()});
function metric(label,n){return '<div class="card"><span>'+label+'</span><strong>'+Number(n||0).toLocaleString("en-US")+'</strong></div>'}
async function render(){
  const names={overview:"نظرة عامة",stats:"إحصائيات المنصة",users:"إدارة المستخدمين",rooms:"إدارة الغرف الصوتية",moderators:"إدارة مشرفي التطبيق",audit:"سجل الإجراءات",agora:"إعدادات Agora الصوتية",future:"خدمات المنصة"};
  $("pageTitle").textContent=names[page]||"لوحة الإدارة";$("content").innerHTML='<div class="loading">جارٍ تحميل البيانات…</div>';
  try{
    if(page==="overview"){let o=(await api("/admin/overview")).overview;$("content").innerHTML='<div class="cards">'+metric("إجمالي المستخدمين",o.users.total)+metric("المستخدمون النشطون",o.users.active)+metric("إجمالي الغرف",o.rooms.total)+metric("المنشورات المنشورة",o.publishedPosts)+'</div><div class="section"><h2>ملخص النظام</h2><p class="muted">الأرقام مسترجعة مباشرة من قاعدة بيانات Happy Live.</p></div>'}
    else if(page==="stats")statsPage((await api("/admin/stats")).stats);
    else if(page==="users")users((await api("/admin/users")).users||[]);
    else if(page==="rooms")rooms((await api("/admin/rooms")).rooms||[]);
    else if(page==="moderators")await moderatorsPage();
    else if(page==="audit")audit((await api("/admin/audit")).entries||[]);
    else if(page==="agora")await agoraPage();
    else $("content").innerHTML='<div class="section"><h2>خدمات غير مفعّلة بعد</h2><p class="notice">VIP والشحن والهدايا والمحفظة لا تملك جداول أو نقاط API حقيقية في الخادم حتى الآن. لن نعرض أرقامًا أو عمليات تجريبية على أنها بيانات فعلية.</p></div>';
  }catch(e){$("content").innerHTML='<div class="section"><p class="error">'+esc(e.message)+'</p><p class="muted">تحقق من صلاحية حسابك الإداري واتصال الخادم.</p></div>'}
}

async function agoraPage(){
  const a=(await api("/admin/agora/status")).agora;
  const configured=a.enabled&&a.certificateConfigured&&!!a.appId;
  const voiceOn=a.voiceEnabled===true&&configured;
  const safeId=esc(a.appId||"غير مضبوط");
  $("content").innerHTML=
    '<div class="section"><div class="section-head"><h2>التحكم العام بالصوت</h2><span class="badge '+(voiceOn?'good':'bad')+'">'+(voiceOn?'الصوت يعمل في التطبيق':'الصوت متوقف في التطبيق')+'</span></div>'+
    '<p class="muted">هذا المفتاح يتحكم في Agora داخل جميع الغرف الصوتية، وليس غرفة واحدة فقط.</p>'+
    '<div class="notice">'+(voiceOn?'الخدمة تعمل الآن ويمكن للمستخدمين دخول مقاعد المايك والتحدث.':'الخدمة متوقفة؛ لا يمكن لأي مستخدم تشغيل المايك أو الحصول على اتصال صوتي.')+'</div>'+
    '<button class="primary" id="agoraVoiceToggle" style="margin-top:18px;background:'+(voiceOn?'linear-gradient(100deg,#8c3547,#572333)':'linear-gradient(100deg,#73d7a8,#398f70)')+';color:#101018" '+(!configured&&!voiceOn?'disabled':'')+'>'+(voiceOn?'إيقاف الصوت في التطبيق بالكامل':'تشغيل الصوت في التطبيق بالكامل')+'</button>'+
    '<p class="muted" style="font-size:12px;margin-top:14px">عند الإيقاف: يتم فصل المستخدمين عن الصوت عند تحديث حالة الغرفة خلال ثوانٍ، وتحرير جميع مقاعد المايك، ومنع حجز مقاعد جديدة. تبقى الدردشة النصية والغرف متاحة.</p>'+
    '<p class="muted" style="font-size:12px">لا تُسجّل مدة استخدام المايك أثناء التوقف. لا يوجد حاليًا نظام فوترة أو عدّاد دقائق مدفوع في المشروع.</p></div>'+
    '<div class="section"><div class="section-head"><h2>اتصال Agora</h2><span class="badge '+(configured?'good':'bad')+'">'+(configured?'مهيأ على الخادم':'غير مكتمل')+'</span></div>'+
    '<p class="muted">إعدادات الصوت تُقرأ من أسرار Cloudflare Worker. شهادة App Certificate لا تُرسل إلى المتصفح ولا تظهر في لوحة الإدارة حفاظًا على أمان المشروع.</p>'+
    '<label class="field">Agora App ID<input value="'+safeId+'" readonly></label>'+
    '<label class="field">Agora App Certificate<input type="password" value="'+(a.certificateConfigured?'••••••••••••••••':'')+'" placeholder="لم يتم ضبط الشهادة" readonly></label>'+
    '<div class="notice">'+(configured?'تم العثور على App ID والشهادة في أسرار الخادم.':'يلزم ضبط App ID وApp Certificate في Cloudflare Worker قبل تشغيل الصوت.')+'</div>'+
    '<p class="muted" style="font-size:12px;margin-top:14px">إعداد الخادم: '+(a.enabled?'مسموح':'متوقف')+' · حالة الشهادة: '+(a.certificateConfigured?'موجودة':'غير موجودة')+'</p>'+
    '<button class="action" id="agoraRefresh">تحديث الحالة</button></div>'+
    '<div class="section"><h2>حماية الصوت</h2><p class="muted">يصدر الخادم رمز اتصال مؤقتًا بعد التحقق من جلسة المستخدم والغرفة ومقعد المايك. لا يتم تخزين الشهادة داخل ملفات الموقع.</p></div>';
  $("agoraRefresh").onclick=()=>render();
  const toggle=$("agoraVoiceToggle");
  toggle.onclick=async()=>{
    const next=!voiceOn;
    const prompt=next?"تشغيل الصوت في جميع الغرف؟":"إيقاف الصوت في جميع الغرف وفصل كل مقاعد المايك؟";
    if(!confirm(prompt))return;
    toggle.disabled=true;
    toggle.textContent="جارٍ تنفيذ التغيير…";
    try{
      await api("/admin/agora/voice",{method:"PATCH",body:JSON.stringify({enabled:next})});
      await agoraPage();
    }catch(error){
      alert(error.message);
      await agoraPage();
    }
  };
}
function statsPage(s){
  const x=s.summary||{},d=s.daily||{},rows=a=>a&&a.length?a.map(v=>'<tr><td>'+esc(v.day)+'</td><td>'+Number(v.total||0).toLocaleString("en-US")+'</td></tr>').join(""):'<tr><td colspan="2" class="empty">لا توجد بيانات خلال الفترة</td></tr>';
  $("content").innerHTML='<div class="cards">'+metric("إجمالي المستخدمين",x.users?.total)+metric("الحسابات النشطة",x.users?.active)+metric("الحسابات المحظورة",x.users?.suspended)+metric("الغرف النشطة",x.rooms?.active)+metric("المنشورات المنشورة",x.publishedPosts)+metric("رسائل الغرف آخر 7 أيام",x.roomMessagesLast7Days)+'</div>'+
  '<div class="section"><h2>التسجيلات اليومية — آخر 7 أيام (UTC)</h2><div class="table-wrap"><table><thead><tr><th>اليوم</th><th>عدد الحسابات</th></tr></thead><tbody>'+rows(d.users)+'</tbody></table></div></div>'+
  '<div class="section"><h2>رسائل الغرف اليومية — آخر 7 أيام (UTC)</h2><div class="table-wrap"><table><thead><tr><th>اليوم</th><th>عدد الرسائل</th></tr></thead><tbody>'+rows(d.messages)+'</tbody></table></div></div><p class="muted">الأرقام محسوبة مباشرة من جداول D1 الحالية.</p>';
}
async function moderatorsPage(){
  if(admin.role!=="owner"){$("content").innerHTML='<div class="section"><p class="notice">إدارة أدوار مشرفي التطبيق متاحة لحساب المالك فقط.</p></div>';return}
  const current=(await api("/admin/moderators")).moderators||[];
  $("content").innerHTML='<div class="section"><h2>المشرفون الحاليون ('+current.length+')</h2><p class="muted">هذه أدوار داخل التطبيق للمستخدمين المسجلين، وليست حسابات دخول لوحة الإدارة.</p><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>البريد</th><th>ID</th><th>الدور</th><th>الحالة</th></tr></thead><tbody>'+
  (current.length?current.map(u=>'<tr><td>'+esc(u.display_name||"—")+'</td><td>'+esc(u.email)+'</td><td>'+esc(u.gabo_id||"—")+'</td><td>'+(u.role==="admin"?"مدير تطبيق":"مشرف")+'</td><td>'+(u.status==="active"?"نشط":"غير نشط")+'</td></tr>').join(""):'<tr><td colspan="5" class="empty">لا يوجد مشرفون معيّنون حاليًا</td></tr>')+'</tbody></table></div></div>'+
  '<div class="section"><div class="section-head"><div><h2>إدارة صلاحيات المستخدمين</h2><p class="muted">ابحث عن مستخدم ثم عيّنه مشرفًا أو مدير تطبيق. لا يمكن تغيير دور المالك.</p></div><input id="moderatorSearch" class="search" placeholder="ابحث بالاسم أو البريد أو ID"></div><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>البريد</th><th>ID</th><th>الدور الحالي</th><th>الإجراء</th></tr></thead><tbody id="moderatorCandidates"></tbody></table></div></div>';
  const draw=list=>{
    $("moderatorCandidates").innerHTML=list.length?list.map(u=>{
      const label=u.admin_role==="owner"?"مالك":u.admin_role==="admin"?"مدير تطبيق":u.admin_role==="moderator"?"مشرف":"مستخدم";
      let action="";if(u.status==="active"&&u.admin_role!=="owner")action=u.admin_role?'<button class="action danger" data-role-user="'+esc(u.id)+'" data-next-role="null">إزالة الدور</button>':'<button class="action" data-role-user="'+esc(u.id)+'" data-next-role="moderator">مشرف</button> <button class="action" data-role-user="'+esc(u.id)+'" data-next-role="admin">مدير</button>';
      return '<tr><td>'+esc(u.display_name||"—")+'</td><td>'+esc(u.email)+'</td><td>'+esc(u.gabo_id||"—")+'</td><td>'+label+'</td><td>'+action+'</td></tr>';
    }).join(""):'<tr><td colspan="5" class="empty">لا توجد نتائج</td></tr>';
    document.querySelectorAll("[data-role-user]").forEach(b=>b.onclick=async()=>{const next=b.dataset.nextRole==="null"?null:b.dataset.nextRole;if(!confirm(next?"تأكيد تعيين هذا الدور؟":"تأكيد إزالة دور الإدارة عن المستخدم؟"))return;b.disabled=true;try{await api("/admin/users/"+b.dataset.roleUser+"/role",{method:"PATCH",body:JSON.stringify({role:next})});await render()}catch(e){alert(e.message);b.disabled=false}});
  };
  draw((await api("/admin/users?limit=100")).users||[]);
  let timer;$("moderatorSearch").oninput=e=>{clearTimeout(timer);const q=e.target.value.trim();timer=setTimeout(async()=>{try{draw((await api("/admin/users?q="+encodeURIComponent(q)+"&limit=100")).users||[])}catch(err){$("moderatorCandidates").innerHTML='<tr><td colspan="5" class="empty">'+esc(err.message)+'</td></tr>'}},250)};
}
function users(a){
  $("content").innerHTML='<div class="section"><div class="section-head"><h2>المستخدمون ('+a.length+')</h2><input id="search" class="search" placeholder="ابحث بالاسم أو البريد أو ID"></div><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>البريد</th><th>ID</th><th>الحالة</th><th>الدور</th><th>الإجراءات</th></tr></thead><tbody id="rows"></tbody></table></div><p class="muted">إيقاف الحساب يمنع استخدامه ويلغي جلساته. الطرد ينهي الجلسات الحالية فقط ولا يمنع تسجيل الدخول مجددًا.</p></div>';
  const canManage=admin.role==="owner"||admin.role==="admin";
  const draw=list=>{
    $("rows").innerHTML=list.length?list.map(u=>{
      const protectedRole=!!u.admin_role&&admin.role!=="owner",canAct=canManage&&!protectedRole&&u.status!=="deleted";
      const label=u.status==="active"?"نشط":u.status==="suspended"?"محظور":"محذوف";
      const actions=canAct?'<button class="action '+(u.status==="active"?"danger":"")+'" data-status-id="'+esc(u.id)+'" data-status-next="'+(u.status==="active"?"suspended":"active")+'">'+(u.status==="active"?"حظر الحساب":"رفع الحظر")+'</button> <button class="action" data-kick-id="'+esc(u.id)+'">طرد الجلسات</button>':"—";
      return '<tr><td>'+esc(u.display_name||"—")+'</td><td>'+esc(u.email)+'</td><td>'+esc(u.gabo_id||"—")+'</td><td><span class="badge '+(u.status==="active"?"good":"bad")+'">'+label+'</span></td><td>'+esc(u.admin_role||"مستخدم")+'</td><td>'+actions+'</td></tr>';
    }).join(""):'<tr><td colspan="6" class="empty">لا توجد نتائج</td></tr>';
    document.querySelectorAll("[data-status-id]").forEach(b=>b.onclick=async()=>{const next=b.dataset.statusNext;if(!confirm(next==="suspended"?"سيتم حظر الحساب وإنهاء جلساته وإخراجه من الغرف. متابعة؟":"تأكيد رفع الحظر عن الحساب؟"))return;b.disabled=true;try{await api("/admin/users/"+b.dataset.statusId+"/status",{method:"PATCH",body:JSON.stringify({status:next})});await render()}catch(e){alert(e.message);b.disabled=false}});
    document.querySelectorAll("[data-kick-id]").forEach(b=>b.onclick=async()=>{if(!confirm("سيتم إنهاء جميع جلسات المستخدم الحالية وإخراجه من الغرف. يمكنه تسجيل الدخول مجددًا. متابعة؟"))return;b.disabled=true;try{const r=await api("/admin/users/"+b.dataset.kickId+"/kick",{method:"POST"});alert("تم إنهاء الجلسات الحالية: "+Number(r.revokedSessions||0));await render()}catch(e){alert(e.message);b.disabled=false}});
  };
  draw(a);let timer;$("search").oninput=e=>{clearTimeout(timer);const q=e.target.value.trim();timer=setTimeout(async()=>{try{draw((await api("/admin/users?q="+encodeURIComponent(q)+"&limit=100")).users||[])}catch(err){$("rows").innerHTML='<tr><td colspan="6" class="empty">'+esc(err.message)+'</td></tr>'}},250)};
}
function rooms(a){$("content").innerHTML='<div class="section"><div class="section-head"><h2>الغرف ('+a.length+')</h2></div><div class="table-wrap"><table><thead><tr><th>الغرفة</th><th>رقمها</th><th>المالك</th><th>الخصوصية</th><th>الحالة</th><th>الإجراء</th></tr></thead><tbody>'+ (a.length?a.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+esc(r.room_code)+'</td><td>'+esc(r.owner_name||"—")+'</td><td>'+(r.visibility==="private"?"خاصة":"عامة")+'</td><td><span class="badge '+(r.status==="active"?"good":"bad")+'">'+(r.status==="active"?"نشطة":"مغلقة")+'</span></td><td><button class="action '+(r.status==="active"?"danger":"")+'" data-room="'+esc(r.id)+'" data-next="'+(r.status==="active"?"closed":"active")+'">'+(r.status==="active"?"إغلاق":"فتح")+'</button></td></tr>').join(""):'<tr><td colspan="6" class="empty">لا توجد غرف</td></tr>')+'</tbody></table></div></div>';document.querySelectorAll("[data-room]").forEach(b=>b.onclick=async()=>{if(!confirm("تأكيد تغيير حالة الغرفة؟"))return;try{await api("/admin/rooms/"+b.dataset.room+"/status",{method:"PATCH",body:JSON.stringify({status:b.dataset.next})});render()}catch(e){alert(e.message)}})}
function audit(a){$("content").innerHTML='<div class="section"><div class="section-head"><h2>آخر الإجراءات ('+a.length+')</h2></div><div class="table-wrap"><table><thead><tr><th>الإجراء</th><th>المدير</th><th>النوع</th><th>المعرف</th><th>التاريخ</th></tr></thead><tbody>'+(a.length?a.map(x=>'<tr><td>'+esc(x.action)+'</td><td>'+esc(x.actor_name||x.actor_email||"—")+'</td><td>'+esc(x.target_type)+'</td><td>'+esc(x.target_id)+'</td><td>'+esc(new Date(x.created_at).toLocaleString("ar"))+'</td></tr>').join(""):'<tr><td colspan="5" class="empty">لا توجد إجراءات</td></tr>')+'</tbody></table></div></div>'}
startup();
</script></body></html>
