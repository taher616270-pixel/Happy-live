<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100d19"><title>Happy Live | الإدارة</title>
<style>
:root{color-scheme:dark;--bg:#100d19;--panel:#1b1628;--line:#382d49;--gold:#e9c77a;--purple:#a77bd5;--text:#f6f0ff;--muted:#a99db8;--green:#6bd4a2;--red:#f0808b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% -10%,#39254f,transparent 38%),var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:30px}.logo{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#f2d995,#a879d8);color:#24182e;font-size:28px;font-weight:900;margin-bottom:18px}h1{font-size:24px;margin:0 0 8px}.muted{color:var(--muted)}.field{display:grid;gap:7px;margin:17px 0}.field input,.search{padding:13px;border-radius:12px;border:1px solid var(--line);background:#100d19;color:var(--text);width:100%}.primary{padding:13px;border-radius:12px;background:linear-gradient(100deg,#d9b96d,#a77bd5);color:#1c1425;font-weight:800;width:100%;border:0}.error{color:var(--red);min-height:22px;font-size:13px}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#15111f;border-left:1px solid var(--line);padding:22px 15px;height:100vh;position:sticky;top:0}.brand{display:flex;gap:11px;align-items:center;padding:5px 8px 25px}.brand .logo{width:42px;height:42px;font-size:22px;margin:0}.brand small{display:block;color:var(--muted)}.nav{display:grid;gap:7px}.nav button,.logout{padding:13px;background:transparent;color:var(--muted);border:0;border-radius:10px;text-align:right}.nav button.active,.nav button:hover{background:#2a2039;color:var(--gold)}.side-foot{position:absolute;bottom:18px;right:15px;left:15px}.logout{width:100%;border:1px solid var(--line);text-align:center}.main{padding:28px;max-width:1450px;width:100%;margin:auto;min-width:0}.top,.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.top h1{margin:0}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}.card,.section{background:linear-gradient(145deg,#1c1729,#171222);border:1px solid var(--line);border-radius:16px;padding:18px}.card span{color:var(--muted);font-size:13px}.card strong{display:block;color:var(--gold);font-size:27px;margin-top:9px}.section{margin-bottom:16px}.section h2{font-size:18px;margin:0}.search{max-width:300px;padding:10px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}td,th{padding:12px;text-align:right;border-bottom:1px solid #30263c;font-size:13px}th{color:var(--muted)}.badge{padding:5px 9px;border-radius:30px;background:#30263c;font-size:11px}.good{color:var(--green)}.bad{color:var(--red)}.action{padding:7px 10px;border:0;border-radius:8px;background:#342744;color:#eee}.danger{background:#48232f;color:#ffb5bd}.notice{padding:14px;border:1px solid #594a34;background:#2b2419;color:#e8d5a7;border-radius:12px}.empty,.loading{text-align:center;padding:25px;color:var(--muted)}@media(max-width:820px){.app{grid-template-columns:1fr}.side{height:auto;position:relative;padding:12px;border:0;border-bottom:1px solid var(--line)}.brand{padding:2px 5px 12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:10px}.side-foot{position:static;margin-top:8px}.main{padding:17px 12px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.top h1{font-size:20px}}@media(max-width:430px){.card{padding:13px}.card strong{font-size:22px}.section{padding:13px}.section-head{align-items:flex-start;flex-direction:column}.search{max-width:none}}
</style></head><body>
<div id="loginView" class="login-wrap"><form id="setupForm" class="login hidden"><div class="logo">H</div><h1>إنشاء كلمة مرور المدير</h1><p class="muted">إعداد أول مرة لحساب المالك المستقل</p><label class="field">رمز التهيئة لمرة واحدة<input id="setupToken" type="password" autocomplete="off" required></label><label class="field">كلمة المرور الجديدة<input id="setupPassword" type="password" autocomplete="new-password" minlength="12" required></label><label class="field">تأكيد كلمة المرور<input id="setupConfirmation" type="password" autocomplete="new-password" minlength="12" required></label><button class="primary" id="setupBtn">إنشاء كلمة المرور</button><div id="setupError" class="error"></div><p class="muted" style="font-size:12px">استخدم 12 حرفًا على الأقل. لا تشارك كلمة المرور مع أي شخص.</p></form><form id="loginForm" class="login"><div class="logo">H</div><h1>لوحة إدارة Happy Live</h1><p class="muted">دخول المالك المستقل</p><label class="field">اسم المستخدم<input id="username" type="text" autocomplete="username" required></label><label class="field">كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" id="loginBtn">تسجيل الدخول</button><div id="loginError" class="error"></div><p class="muted" style="font-size:12px">حساب الإدارة مستقل عن حسابات مستخدمي التطبيق.</p></form></div>
<div id="appView" class="app hidden"><aside class="side"><div class="brand"><div class="logo">H</div><div><b>HAPPY LIVE</b><small>مركز الإدارة</small></div></div><nav class="nav"><button class="active" data-page="overview">◈　الرئيسية</button><button data-page="users">♙　المستخدمون</button><button data-page="rooms">◉　الغرف الصوتية</button><button data-page="audit">▤　سجل الإجراءات</button><button data-page="future">✧　خدمات المنصة</button></nav><div class="side-foot"><button id="logoutBtn" class="logout">تسجيل الخروج</button></div></aside><main class="main"><header class="top"><div><h1 id="pageTitle">نظرة عامة</h1><small id="adminIdentity" class="muted"></small></div><span class="badge good">اتصال آمن</span></header><div id="content"><div class="loading">جارٍ التحميل…</div></div></main></div>
<script>
const API="https://happy-live-api.taher616270.workers.dev/api/v1";let token=sessionStorage.getItem("happy_live_admin_token")||"",admin=null,page="overview";
const $=id=>document.getElementById(id);function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function api(path,opt){opt=opt||{};let r=await fetch(API+path,{method:opt.method||"GET",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:opt.body});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw Error(d.message||d.error||"تعذر تنفيذ الطلب");return d}
function login(msg){$("loginView").classList.remove("hidden");$("appView").classList.add("hidden");$("loginError").textContent=msg||""}

async function startup(){
  try{
    const response=await fetch(API+"/admin/auth/setup-status",{cache:"no-store"});
    const status=await response.json();
    if(!response.ok)throw Error(status.error||"تعذر التحقق من حالة إعداد المدير");
    if(status.setupRequired){
      $("loginForm").classList.add("hidden");
      $("setupForm").classList.remove("hidden");
      $("appView").classList.add("hidden");
      return;
    }
    $("setupForm").classList.add("hidden");
    await verify();
  }catch(e){login(e.message)}
}
$("setupForm").onsubmit=async e=>{
  e.preventDefault();
  const btn=$("setupBtn");btn.disabled=true;$("setupError").textContent="";
  try{
    const response=await fetch(API+"/admin/auth/setup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      setupToken:$("setupToken").value.trim(),
      password:$("setupPassword").value,
      confirmation:$("setupConfirmation").value
    })});
    const data=await response.json();
    if(!response.ok)throw Error(data.message||data.error||"تعذر إنشاء كلمة المرور");
    $("setupForm").classList.add("hidden");
    $("loginForm").classList.remove("hidden");
    $("username").value="owner";
    $("password").value="";
    $("loginError").textContent="تم إنشاء كلمة المرور بنجاح. سجّل الدخول الآن.";
    $("setupToken").value="";$("setupPassword").value="";$("setupConfirmation").value="";
  }catch(error){$("setupError").textContent=error.message}
  finally{btn.disabled=false}
};
function app(){ $("loginView").classList.add("hidden");$("appView").classList.remove("hidden");$("adminIdentity").textContent=admin.name+" · "+admin.username+" · مالك"}
async function verify(){if(!token)return login();try{admin=(await api("/admin/me")).admin;app();await render()}catch(e){token="";sessionStorage.removeItem("happy_live_admin_token");login(e.message)}}
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginBtn").disabled=true;try{let r=await fetch(API+"/admin/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("username").value.trim(),password:$("password").value})});let d=await r.json();if(!r.ok)throw Error(d.message||"بيانات الدخول غير صحيحة");token=d.accessToken;sessionStorage.setItem("happy_live_admin_token",token);admin=(await api("/admin/me")).admin;app();await render()}catch(x){token="";sessionStorage.removeItem("happy_live_admin_token");login(x.message)}finally{$("loginBtn").disabled=false}};
$("logoutBtn").onclick=async()=>{try{await api("/admin/auth/logout",{method:"POST"})}catch(e){}token="";sessionStorage.removeItem("happy_live_admin_token");login()};
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-page]").forEach(x=>x.classList.toggle("active",x===b));page=b.dataset.page;render()});
function metric(label,n){return '<div class="card"><span>'+label+'</span><strong>'+Number(n||0).toLocaleString("en-US")+'</strong></div>'}
async function render(){let names={overview:"نظرة عامة",users:"إدارة المستخدمين",rooms:"إدارة الغرف الصوتية",audit:"سجل الإجراءات",future:"خدمات المنصة"};$("pageTitle").textContent=names[page];$("content").innerHTML='<div class="loading">جارٍ تحميل البيانات…</div>';try{if(page==="overview"){let o=(await api("/admin/overview")).overview;$("content").innerHTML='<div class="cards">'+metric("إجمالي المستخدمين",o.users.total)+metric("المستخدمون النشطون",o.users.active)+metric("إجمالي الغرف",o.rooms.total)+metric("المنشورات المنشورة",o.publishedPosts)+'</div><div class="section"><h2>ملخص النظام</h2><p class="muted">الأرقام مسترجعة مباشرة من قاعدة بيانات Happy Live.</p></div>'}else if(page==="users"){let a=(await api("/admin/users")).users||[];users(a)}else if(page==="rooms"){rooms((await api("/admin/rooms")).rooms||[])}else if(page==="audit"){audit((await api("/admin/audit")).entries||[])}else{$("content").innerHTML='<div class="section"><h2>أقسام قيد التجهيز</h2><p class="notice">VIP والشحن والهدايا وإدارة المشرفين غير مدعومة عبر API حاليًا. لن نعرض بيانات تجريبية على أنها حقيقية.</p></div>'}}catch(e){$("content").innerHTML='<div class="section"><p class="error">'+esc(e.message)+'</p><p class="muted">تحقق من صلاحية حسابك الإداري واتصال الخادم.</p></div>'}}
function users(a){$("content").innerHTML='<div class="section"><div class="section-head"><h2>المستخدمون ('+a.length+')</h2><input id="search" class="search" placeholder="ابحث بالاسم أو البريد أو ID"></div><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>البريد</th><th>ID</th><th>الحالة</th><th>الدور</th><th>الإجراء</th></tr></thead><tbody id="rows"></tbody></table></div></div>';let draw=list=>{$("rows").innerHTML=list.length?list.map(u=>'<tr><td>'+esc(u.display_name||"—")+'</td><td>'+esc(u.email)+'</td><td>'+esc(u.gabo_id||"—")+'</td><td><span class="badge '+(u.status==="active"?"good":"bad")+'">'+(u.status==="active"?"نشط":u.status==="suspended"?"موقوف":"محذوف")+'</span></td><td>'+esc(u.admin_role||"مستخدم")+'</td><td>'+(admin.role==="moderator"||u.status==="deleted"||(u.admin_role&&admin.role!=="owner")?"—":'<button class="action '+(u.status==="active"?"danger":"")+'" data-id="'+esc(u.id)+'" data-next="'+(u.status==="active"?"suspended":"active")+'">'+(u.status==="active"?"إيقاف":"تفعيل")+'</button>')+'</td></tr>').join(""):'<tr><td colspan="6" class="empty">لا توجد نتائج</td></tr>';document.querySelectorAll("[data-id]").forEach(b=>b.onclick=async()=>{if(!confirm("تأكيد تغيير حالة المستخدم؟"))return;try{await api("/admin/users/"+b.dataset.id+"/status",{method:"PATCH",body:JSON.stringify({status:b.dataset.next})});render()}catch(e){alert(e.message)}})};draw(a);let searchTimer; $("search").oninput=e=>{clearTimeout(searchTimer);const q=e.target.value.trim();searchTimer=setTimeout(async()=>{try{const result=await api("/admin/users?q="+encodeURIComponent(q)+"&limit=100");draw(result.users||[])}catch(err){$("rows").innerHTML='<tr><td colspan="6" class="empty">'+esc(err.message)+'</td></tr>'}},250)}}
function rooms(a){$("content").innerHTML='<div class="section"><div class="section-head"><h2>الغرف ('+a.length+')</h2></div><div class="table-wrap"><table><thead><tr><th>الغرفة</th><th>رقمها</th><th>المالك</th><th>الخصوصية</th><th>الحالة</th><th>الإجراء</th></tr></thead><tbody>'+ (a.length?a.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+esc(r.room_code)+'</td><td>'+esc(r.owner_name||"—")+'</td><td>'+(r.visibility==="private"?"خاصة":"عامة")+'</td><td><span class="badge '+(r.status==="active"?"good":"bad")+'">'+(r.status==="active"?"نشطة":"مغلقة")+'</span></td><td><button class="action '+(r.status==="active"?"danger":"")+'" data-room="'+esc(r.id)+'" data-next="'+(r.status==="active"?"closed":"active")+'">'+(r.status==="active"?"إغلاق":"فتح")+'</button></td></tr>').join(""):'<tr><td colspan="6" class="empty">لا توجد غرف</td></tr>')+'</tbody></table></div></div>';document.querySelectorAll("[data-room]").forEach(b=>b.onclick=async()=>{if(!confirm("تأكيد تغيير حالة الغرفة؟"))return;try{await api("/admin/rooms/"+b.dataset.room+"/status",{method:"PATCH",body:JSON.stringify({status:b.dataset.next})});render()}catch(e){alert(e.message)}})}
function audit(a){$("content").innerHTML='<div class="section"><div class="section-head"><h2>آخر الإجراءات ('+a.length+')</h2></div><div class="table-wrap"><table><thead><tr><th>الإجراء</th><th>المدير</th><th>النوع</th><th>المعرف</th><th>التاريخ</th></tr></thead><tbody>'+(a.length?a.map(x=>'<tr><td>'+esc(x.action)+'</td><td>'+esc(x.actor_name||x.actor_email||"—")+'</td><td>'+esc(x.target_type)+'</td><td>'+esc(x.target_id)+'</td><td>'+esc(new Date(x.created_at).toLocaleString("ar"))+'</td></tr>').join(""):'<tr><td colspan="5" class="empty">لا توجد إجراءات</td></tr>')+'</tbody></table></div></div>'}
startup();
</script></body></html>
