<script>

async function uploadGiftSound(file){
  if(!file)return null;
  const ext=(file.name.split(".").pop()||"").toLowerCase();
  if(ext!=="mp3"||file.size>5*1024*1024)throw Error("اختر ملف MP3 فقط، وبحجم لا يتجاوز 5MB.");
  const authResponse=await fetch(API+"/imagekit/auth",{headers:{Authorization:"Bearer "+token}});
  const auth=await authResponse.json();if(!authResponse.ok||!auth.token||!auth.signature||!auth.expire||!auth.publicKey)throw Error(auth.message||auth.error||"تعذر تجهيز رفع الصوت.");
  const form=new FormData();form.append("file",file);form.append("fileName",file.name);form.append("publicKey",auth.publicKey);form.append("token",auth.token);form.append("expire",String(auth.expire));form.append("signature",auth.signature);form.append("folder","/happy-live/gift-sounds");form.append("useUniqueFileName","true");

  if(!response.ok||!result.url||!result.fileId)throw Error("فشل رفع ملف الصوت إلى ImageKit.");
  return result.url;
}
function chooseGiftSoundFile(){

}

  try{
    const response=await fetch(API+"/admin/auth/setup-status",{cache:"no-store"});
    const status=await response.json();
    if(!response.ok)throw Error(status.error||"تعذر التحقق من حالة إعداد المدير");

      $("loginForm").classList.add("hidden");
      $("setupForm").classList.remove("hidden");
      $("appView").classList.add("hidden");
      return;
    }
    $("setupForm").classList.add("hidden");

  }catch(e){login(e.message)}

      setupToken:$("setupToken").value.trim(),
      password:$("setupPassword").value,
      confirmation:$("setupConfirmation").value

function metric(label,n){return '<div class="card"><span>'+label+'</span><strong>'+Number(n||0).toLocaleString("en-US")+'</strong></div>'}
async function render(){
  const names={overview:"لوحة التحكم",regions:"المناطق والدول",agencies:"الوكالات",users:"المستخدمين",banners:"البنرات والسبلاش",vip:"لـVIP",cp:"لـCP",events:"الأحداث",levels:"المستويات",rooms:"الغرف واللايف",posts:"المنشورات",gifts:"الهدايا",emojis:"الرموز التعبيرية","room-bom":"روم بوم","room-target":"تارجت الغرفة","lucky-box":"صندوق الحظ","host-level":"مستوى المضيف",withdrawals:"السحب",store:"المتجر",badges:"الشارات",medals:"الأوسمة","invite-code":"رمز الدعوة",support:"الدعم",families:"العائلات",games:"الألعاب",recharge:"الشحن",wallets:"الكوينز والمحافظ",rewards:"المكافآت",reports:"التقارير","chat-groups":"الدردشة والجروبات",moderation:"الإشراف والحظر",notifications:"الإشعارات",moderators:"المستخدمين والأذونات",agora:"الإعدادات",other:"أخرى",audit:"سجل الإجراءات",stats:"الإحصائيات",future:"خدمات المنصة"};
  $("pageTitle").textContent=names[page]||"لوحة الإدارة";$("content").innerHTML='<div class="loading">جارٍ تحميل البيانات…</div>';
  try{
    if(page==="overview"){
      const [overviewResponse,statsResponse]=await Promise.all([api("/admin/overview"),api("/admin/stats")]);
      const o=overviewResponse.overview||{},stats=statsResponse.stats||{},summary=stats.summary||{};
      let chartMode="users";
      $("content").innerHTML=
        '<div class="dashboard-head"><div><h2>الصفحة الرئيسية</h2><p class="muted">إحصائيات عامة من بيانات Happy Live الفعلية</p></div><div class="dashboard-actions"><button class="action" id="dashboardFilter">تصفية الرسم</button><button class="action" id="dashboardRefresh">↻ تحديث</button></div></div>'+
        '<div class="dashboard-tabs" role="tablist" aria-label="أقسام لوحة التحكم">'+
        '<button type="button" class="active" role="tab" aria-selected="true" data-dashboard-tab="general">عامة</button>'+
        '<button type="button" role="tab" aria-selected="false" data-dashboard-tab="users">المستخدمين</button>'+
        '<button type="button" role="tab" aria-selected="false" data-dashboard-tab="rooms">الغرف</button>'+
        '<button type="button" role="tab" aria-selected="false" data-dashboard-tab="agencies">الوكالات</button>'+
        '<button type="button" role="tab" aria-selected="false" data-dashboard-tab="bd">BD</button>'+
        '<button type="button" role="tab" aria-selected="false" data-dashboard-tab="games">اللعبة</button></div>'+
        '<div id="dashboardTabContent"></div>';
      const card=(icon,label,value)=>'<div class="dashboard-stat"><div class="dashboard-stat-icon">'+icon+'</div><div class="dashboard-stat-copy"><strong>'+Number(value||0).toLocaleString("en-US")+'</strong><span>'+label+'</span></div></div>';
      const chart=()=>{
        const rows=(chartMode==="users"?(stats.daily?.users||[]):(stats.daily?.messages||[]));
        const max=Math.max(1,...rows.map(x=>Number(x.total||0)));
        const title=chartMode==="users"?"التسجيلات اليومية — آخر 7 أيام":"رسائل الغرف اليومية — آخر 7 أيام";
        const bars=rows.length?rows.map(x=>{
          const value=Number(x.total||0),height=Math.max(4,Math.round(value/max*132));
          const label=new Date(x.day+"T00:00:00Z").toLocaleDateString("ar",{weekday:"short",timeZone:"UTC"});
          return '<div class="dashboard-bar-item"><b>'+value.toLocaleString("en-US")+'</b><div class="dashboard-bar" style="height:'+height+'px"></div><span>'+esc(label)+'</span></div>';
        }).join(""):'<div class="empty">لا توجد بيانات خلال آخر 7 أيام</div>';
        return '<div class="section dashboard-section"><div class="section-head"><h2>'+title+'</h2><span class="badge">آخر 7 أيام</span></div><div class="dashboard-chart">'+bars+'</div></div>';
      };
      const followers=()=>{
        const rows=stats.topFollowers||[];
        return '<div class="section dashboard-section"><div class="section-head"><h2>أعلى متابعين</h2><span class="badge">'+rows.length+' مستخدمين</span></div>'+
          (rows.length?'<div class="table-wrap"><table><thead><tr><th>#</th><th>المستخدم</th><th>عدد المتابعين</th></tr></thead><tbody>'+rows.map((u,i)=>'<tr><td>'+(i+1)+'</td><td><span class="dashboard-avatar">♙</span> '+esc(u.name||"مستخدم")+'</td><td><span class="dashboard-count">'+Number(u.count||0).toLocaleString("en-US")+'</span></td></tr>').join("")+'</tbody></table></div>':'<div class="empty">لا توجد بيانات متابعين حتى الآن</div>')+'</div>';
      };
      const renderTab=tab=>{
        const root=$("dashboardTabContent");
        if(tab==="general"){
          root.innerHTML='<div class="dashboard-stats-grid">'+
            card("♙","إجمالي المستخدمين",o.users?.total)+
            card("●","المستخدمون النشطون",o.users?.active)+
            card("◉","إجمالي الغرف",o.rooms?.total)+
            card("▤","المنشورات المنشورة",o.publishedPosts)+'</div>'+chart()+followers();
        }else if(tab==="users"){
          root.innerHTML='<div class="dashboard-stats-grid">'+card("♙","إجمالي المستخدمين",summary.users?.total)+card("●","الحسابات النشطة",summary.users?.active)+card("⊘","الحسابات المحظورة",summary.users?.suspended)+'</div>'+chart()+followers();
        }else if(tab==="rooms"){
          root.innerHTML='<div class="dashboard-stats-grid">'+card("◉","إجمالي الغرف",summary.rooms?.total)+card("●","الغرف النشطة",summary.rooms?.active)+card("▤","رسائل الغرف آخر 7 أيام",summary.roomMessagesLast7Days)+'</div>'+chart();
        }else{
          const labels={agencies:"الوكالات",bd:"BD",games:"اللعبة"};
          root.innerHTML='<div class="section"><h2>'+labels[tab]+'</h2><p class="notice">لا توجد حاليًا نقطة API أو بيانات موثوقة لهذا القسم في الخادم. لم نضع أرقامًا تجريبية بدل البيانات الحقيقية.</p></div>';
        }
      };
      document.querySelectorAll("[data-dashboard-tab]").forEach(button=>button.addEventListener("click",()=>{
        document.querySelectorAll("[data-dashboard-tab]").forEach(x=>{const active=x===button;x.classList.toggle("active",active);x.setAttribute("aria-selected",String(active))});
        renderTab(button.dataset.dashboardTab);
      }));
      $("dashboardFilter").onclick=()=>{chartMode=chartMode==="users"?"messages":"users";renderTab(document.querySelector("[data-dashboard-tab].active")?.dataset.dashboardTab||"general")};
      $("dashboardRefresh").onclick=()=>render();
      renderTab("general");
    }
    else if(page==="stats")statsPage((await api("/admin/stats")).stats);
    else if(page==="users")users((await api("/admin/users")).users||[]);
    else if(page==="wallets")await walletsPage();
    else if(page==="gifts")await giftsPage();
    else if(page==="games")await catGreedMainPage();
    else if(page==="rooms")rooms((await api("/admin/rooms")).rooms||[]);
    else if(page==="reports")await roomReportsPage();
    else if(page==="moderators")await moderatorsPage();
    else if(page==="audit")audit((await api("/admin/audit")).entries||[]);
    else if(page==="agora")await agoraPage();
    else $("content").innerHTML='<div class="section"><h2>خدمات غير مفعّلة بعد</h2><p class="notice">VIP والشحن والهدايا ما زالت تحتاج خدماتها الخاصة. المحفظة مرتبطة الآن برصيد العملات وسجل الحركات الفعلي.</p></div>';
  }catch(e){$("content").innerHTML='<div class="section"><p class="error">'+esc(e.message)+'</p><p class="muted">تحقق من صلاحية حسابك الإداري واتصال الخادم.</p></div>'}
}


async function catGreedMainPage(){
  const data=await api("/admin/games/cat-greed/overview");
  if(window.catGreedMonitorTimer)clearInterval(window.catGreedMonitorTimer);
  window.catGreedMonitorTimer=setInterval(()=>{if(page==="games")catGreedMainPage().catch(()=>{});else{clearInterval(window.catGreedMonitorTimer);window.catGreedMonitorTimer=null}},1000);
  const totals=data.totals||{},players=data.players||[],rounds=data.rounds||[];
  const fmt=n=>Number(n||0).toLocaleString("en-US");
  $("content").innerHTML=
    '<div class="section"><div class="section-head"><div><h2>قط الجشع 🐱</h2><p class="muted">إدارة اللاعبين ومراقبة الجولات من لوحة Happy Live الرئيسية.</p></div><a class="action" href="../cat-greed-admin/" target="_blank" rel="noopener">فتح لوحة إدارة اللعبة المستقلة ↗</a></div>'+
    '<div class="cards">'+metric("عدد الجولات",totals.rounds)+metric("إجمالي الرهانات",totals.wagered)+metric("اللاعبون",players.length)+'</div>'+
    '<div class="notice">احتمالات النتيجة موحّدة ومعلنة للجميع. يمكنك هنا إيقاف لاعب أو تحديد سقف رهانه، ومراجعة نتائجه؛ لا توجد نسب فوز سرية مختلفة بين اللاعبين.</div></div>'+
    '<div class="section"><div class="section-head"><h2>الجولات الأخيرة</h2><button class="action" id="catGreedRefresh">تحديث</button></div>'+
    (rounds.length?'<div class="table-wrap"><table><thead><tr><th>الجولة</th><th>الحالة</th><th>النتيجة</th><th>التوقيت</th><th>بصمة النتيجة</th></tr></thead><tbody>'+
      rounds.map(r=>'<tr><td>'+esc(r.id)+'</td><td>'+ (r.phase==="result"?'انتهت':'استقبال رهانات')+'</td><td>'+ (r.special==="salad"?'🥗 السلطة':r.special==="pizza"?'🍕 البيتزا':r.result_slot==null?'—':'الرمز '+(Number(r.result_slot)+1))+'</td><td>'+esc(r.settled_at||r.closes_at||"")+'</td><td><code>'+esc(String(r.seed_commitment||"").slice(0,18))+'…</code></td></tr>').join("")+
    '</tbody></table></div>':'<div class="empty">لا توجد جولات بعد. فعّل اللعبة من لوحة اللعبة المستقلة بعد مراجعة الإعدادات.</div>')+'</div>'+
    '<div class="section"><div class="section-head"><h2>اللاعبون وحدود الرهان</h2><span class="badge">'+players.length+' لاعب</span></div>'+
    (players.length?'<div class="table-wrap"><table><thead><tr><th>اللاعب</th><th>الجولات</th><th>فوز</th><th>خسارة</th><th>إجمالي الرهان</th><th>إجمالي الجوائز</th><th>الحالة</th><th>سقف الرهان/جولة</th><th>إجراء</th></tr></thead><tbody>'+
      players.map(p=>'<tr><td>'+esc(p.name||"مستخدم")+' <small class="muted">'+esc(p.userCode||"")+'</small></td><td>'+fmt(p.rounds)+'</td><td>'+fmt(p.wins)+'</td><td>'+fmt(p.losses)+'</td><td>'+fmt(p.wagered)+'</td><td>'+fmt(p.paid)+'</td><td>'+(Number(p.enabled)===1?'نشط':'موقوف')+'</td><td>'+fmt(p.maxBetPerRound)+'</td><td><button class="action" data-cat-player="'+esc(p.id)+'" data-enabled="'+(Number(p.enabled)===1?'0':'1')+'">'+(Number(p.enabled)===1?'إيقاف':'تفعيل')+'</button> <button class="action" data-cat-limit="'+esc(p.id)+'" data-current="'+Number(p.maxBetPerRound||1000000)+'">تعديل السقف</button></td></tr>').join("")+
    '</tbody></table></div>':'<div class="empty">سيظهر اللاعبون بعد أول رهانات.</div>')+'</div>';
  $("catGreedRefresh").onclick=()=>catGreedMainPage();
  document.querySelectorAll("[data-cat-player]").forEach(b=>b.onclick=async()=>{
    b.disabled=true;
    try{await api("/admin/games/cat-greed/players/"+encodeURIComponent(b.dataset.catPlayer),{method:"PATCH",body:JSON.stringify({enabled:b.dataset.enabled==="1"})});await catGreedMainPage();}
    catch(e){alert(e.message);b.disabled=false}
  });
  document.querySelectorAll("[data-cat-limit]").forEach(b=>b.onclick=async()=>{
    const value=prompt("أدخل الحد الأعلى للرهان في الجولة الواحدة:",b.dataset.current);
    if(value===null)return;
    const limit=Number(value);
    if(!Number.isSafeInteger(limit)||limit<10||limit>100000000){alert("أدخل رقماً من 10 إلى 100,000,000");return}
    b.disabled=true;
    try{await api("/admin/games/cat-greed/players/"+encodeURIComponent(b.dataset.catLimit),{method:"PATCH",body:JSON.stringify({maxBetPerRound:limit})});await catGreedMainPage();}
    catch(e){alert(e.message);b.disabled=false}
  });
}

    '<p class="muted" style="font-size:12px">لا تُسجّل مدة استخدام المايك أثناء التوقف. لا يوجد حاليًا نظام فوترة أو عدّاد دقائق مدفوع في المشروع.</p></div>'+
    '<div class="section"><div class="section-head"><h2>اتصال Agora</h2><span class="badge '+(configured?'good':'bad')+'">'+(configured?'مهيأ على الخادم':'غير مكتمل')+'</span></div>'+
    '<p class="muted">إعدادات الصوت تُقرأ من أسرار Cloudflare Worker. شهادة App Certificate لا تُرسل إلى المتصفح ولا تظهر في لوحة الإدارة حفاظًا على أمان المشروع.</p>'+
    '<label class="field">Agora App ID<input value="'+safeId+'" readonly></label>'+
    '<label class="field">Agora App Certificate<input type="password" value="'+(a.certificateConfigured?'••••••••••••••••':'')+'" placeholder="لم يتم ضبط الشهادة" readonly></label>'+
    '<div class="notice">'+(configured?'تم العثور على App ID والشهادة في أسرار الخادم.':'يلزم ضبط App ID وApp Certificate في Cloudflare Worker قبل تشغيل الصوت.')+'</div>'+
    '<p class="muted" style="font-size:12px;margin-top:14px">إعداد الخادم: '+(a.enabled?'مسموح':'متوقف')+' · حالة الشهادة: '+(a.certificateConfigured?'موجودة':'غير موجودة')+'</p>'+
    '<button class="action" id="agoraRefresh">تحديث الحالة</button></div>'+
    '<div class="section"><h2>حماية الصوت</h2><p class="muted">يصدر الخادم رمز اتصال مؤقتًا بعد التحقق من جلسة المستخدم والغرفة ومقعد المايك. لا يتم تخزين الشهادة داخل ملفات الموقع.</p></div>';
  $("agoraRefresh").onclick=()=>render();
  const toggle=$("agoraVoiceToggle");
  toggle.onclick=async()=>{
    const next=!voiceOn;
    const prompt=next?"تشغيل الصوت في جميع الغرف؟":"إيقاف الصوت في جميع الغرف وفصل كل مقاعد المايك؟";
    if(!confirm(prompt))return;
    toggle.disabled=true;
    toggle.textContent="جارٍ تنفيذ التغيير…";
    try{
      await api("/admin/agora/voice",{method:"PATCH",body:JSON.stringify({enabled:next})});
      await agoraPage();
    }catch(error){
      alert(error.message);
      await agoraPage();
    }
  };
}

  $("content").innerHTML='<div class="cards">'+metric("إجمالي المستخدمين",x.users?.total)+metric("الحسابات النشطة",x.users?.active)+metric("الحسابات المحظورة",x.users?.suspended)+metric("الغرف النشطة",x.rooms?.active)+metric("المنشورات المنشورة",x.publishedPosts)+metric("رسائل الغرف آخر 7 أيام",x.roomMessagesLast7Days)+'</div>'+

  '<div class="section"><h2>رسائل الغرف اليومية — آخر 7 أيام (UTC)</h2><div class="table-wrap"><table><thead><tr><th>اليوم</th><th>عدد الرسائل</th></tr></thead><tbody>'+rows(d.messages)+'</tbody></table></div></div><p class="muted">الأرقام محسوبة مباشرة من جداول D1 الحالية.</p>';
}
async function moderatorsPage(){
  if(admin.role!=="owner"){$("content").innerHTML='<div class="section"><p class="notice">إدارة أدوار مشرفي التطبيق متاحة لحساب المالك فقط.</p></div>';return}
  const current=(await api("/admin/moderators")).moderators||[];
  $("content").innerHTML='<div class="section"><h2>المشرفون الحاليون ('+current.length+')</h2><p class="muted">هذه أدوار داخل التطبيق للمستخدمين المسجلين، وليست حسابات دخول لوحة الإدارة.</p><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>البريد</th><th>ID</th><th>الدور</th><th>الحالة</th></tr></thead><tbody>'+
  (current.length?current.map(u=>'<tr><td>'+esc(u.display_name||"—")+'</td><td>'+esc(u.email)+'</td><td>'+esc(u.gabo_id||"—")+'</td><td>'+(u.role==="admin"?"مدير تطبيق":"مشرف")+'</td><td>'+(u.status==="active"?"نشط":"غير نشط")+'</td></tr>').join(""):'<tr><td colspan="5" class="empty">لا يوجد مشرفون معيّنون حاليًا</td></tr>')+'</tbody></table></div></div>'+
  '<div class="section"><div class="section-head"><div><h2>إدارة صلاحيات المستخدمين</h2><p class="muted">ابحث عن مستخدم ثم عيّنه مشرفًا أو مدير تطبيق. لا يمكن تغيير دور المالك.</p></div><input id="moderatorSearch" class="search" placeholder="ابحث بالاسم أو البريد أو ID"></div><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>البريد</th><th>ID</th><th>الدور الحالي</th><th>الإجراء</th></tr></thead><tbody id="moderatorCandidates"></tbody></table></div></div>';

      let action="";if(u.status==="active"&&u.admin_role!=="owner")action=u.admin_role?'<button class="action danger" data-role-user="'+esc(u.id)+'" data-next-role="null">إزالة الدور</button>':'<button class="action" data-role-user="'+esc(u.id)+'" data-next-role="moderator">مشرف</button> <button class="action" data-role-user="'+esc(u.id)+'" data-next-role="admin">مدير</button>';
      return '<tr><td>'+esc(u.display_name||"—")+'</td><td>'+esc(u.email)+'</td><td>'+esc(u.gabo_id||"—")+'</td><td>'+label+'</td><td>'+action+'</td></tr>';
    }).join(""):'<tr><td colspan="5" class="empty">لا توجد نتائج</td></tr>';
    document.querySelectorAll("[data-role-user]").forEach(b=>b.onclick=async()=>{const next=b.dataset.nextRole==="null"?null:b.dataset.nextRole;if(!confirm(next?"تأكيد تعيين هذا الدور؟":"تأكيد إزالة دور الإدارة عن المستخدم؟"))return;b.disabled=true;try{await api("/admin/users/"+b.dataset.roleUser+"/role",{method:"PATCH",body:JSON.stringify({role:next})});await render()}catch(e){alert(e.message);b.disabled=false}});
  };
  draw((await api("/admin/users?limit=100")).users||[]);
  let timer;$("moderatorSearch").oninput=e=>{clearTimeout(timer);const q=e.target.value.trim();timer=setTimeout(async()=>{try{draw((await api("/admin/users?q="+encodeURIComponent(q)+"&limit=100")).users||[])}catch(err){$("moderatorCandidates").innerHTML='<tr><td colspan="5" class="empty">'+esc(err.message)+'</td></tr>'}},250)};
}
function users(a){
  $("content").innerHTML='<div class="section"><div class="section-head"><h2>المستخدمون ('+a.length+')</h2><input id="search" class="search" placeholder="ابحث بالاسم أو البريد أو ID"></div><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>البريد</th><th>ID</th><th>الحالة</th><th>الدور</th><th>الإجراءات</th></tr></thead><tbody id="rows"></tbody></table></div><p class="muted">إيقاف الحساب يمنع استخدامه ويلغي جلساته. الطرد ينهي الجلسات الحالية فقط ولا يمنع تسجيل الدخول مجددًا.</p></div>';
  const canManage=admin.role==="owner"||admin.role==="admin";
  const draw=list=>{
    $("rows").innerHTML=list.length?list.map(u=>{
      const protectedRole=!!u.admin_role&&admin.role!=="owner",canAct=canManage&&!protectedRole&&u.status!=="deleted";
      const label=u.status==="active"?"نشط":u.status==="suspended"?"محظور":"محذوف";
      const actions=canAct?'<button class="action '+(u.status==="active"?"danger":"")+'" data-status-id="'+esc(u.id)+'" data-status-next="'+(u.status==="active"?"suspended":"active")+'">'+(u.status==="active"?"حظر الحساب":"رفع الحظر")+'</button> <button class="action" data-kick-id="'+esc(u.id)+'">طرد الجلسات</button>':"—";
      return '<tr><td>'+esc(u.display_name||"—")+'</td><td>'+esc(u.email)+'</td><td>'+esc(u.gabo_id||"—")+'</td><td><span class="badge '+(u.status==="active"?"good":"bad")+'">'+label+'</span></td><td>'+esc(u.admin_role||"مستخدم")+'</td><td>'+actions+'</td></tr>';
    }).join(""):'<tr><td colspan="6" class="empty">لا توجد نتائج</td></tr>';
    document.querySelectorAll("[data-status-id]").forEach(b=>b.onclick=async()=>{const next=b.dataset.statusNext;if(!confirm(next==="suspended"?"سيتم حظر الحساب وإنهاء جلساته وإخراجه من الغرف. متابعة؟":"تأكيد رفع الحظر عن الحساب؟"))return;b.disabled=true;try{await api("/admin/users/"+b.dataset.statusId+"/status",{method:"PATCH",body:JSON.stringify({status:next})});await render()}catch(e){alert(e.message);b.disabled=false}});
    document.querySelectorAll("[data-kick-id]").forEach(b=>b.onclick=async()=>{if(!confirm("سيتم إنهاء جميع جلسات المستخدم الحالية وإخراجه من الغرف. يمكنه تسجيل الدخول مجددًا. متابعة؟"))return;b.disabled=true;try{const r=await api("/admin/users/"+b.dataset.kickId+"/kick",{method:"POST"});alert("تم إنهاء الجلسات الحالية: "+Number(r.revokedSessions||0));await render()}catch(e){alert(e.message);b.disabled=false}});
  };
  draw(a);let timer;$("search").oninput=e=>{clearTimeout(timer);const q=e.target.value.trim();timer=setTimeout(async()=>{try{draw((await api("/admin/users?q="+encodeURIComponent(q)+"&limit=100")).users||[])}catch(err){$("rows").innerHTML='<tr><td colspan="6" class="empty">'+esc(err.message)+'</td></tr>'}},250)};
}
function rooms(a){
  const canManage=admin.role==="owner"||admin.role==="admin";
  $("content").innerHTML='<div class="section"><div class="section-head"><h2>الغرف ('+a.length+')</h2></div><div class="table-wrap"><table><thead><tr><th>الغرفة</th><th>رقمها</th><th>المالك</th><th>الخصوصية</th><th>الحالة</th><th>الإجراء</th></tr></thead><tbody>'+

    (canManage?'<button class="action '+(r.status==="active"?"danger":"")+'" data-room-status="'+esc(r.id)+'" data-next="'+(r.status==="active"?"closed":"active")+'">'+(r.status==="active"?"إغلاق":"فتح")+'</button>':'<span class="muted">قراءة فقط</span>')+

    catch(e){alert(e.message)}

async function loadRoomModeration(roomId,roomName,q=""){
  const root=$("roomModeration");if(!root)return;
  root.innerHTML='<div class="section"><div class="loading">جارٍ تحميل إدارة الغرفة…</div></div>';
  try{
    const endpoint="/admin/rooms/"+encodeURIComponent(roomId)+"/moderation"+(q?"?q="+encodeURIComponent(q):"");
    const data=await api(endpoint);
    const canManage=admin.role==="owner"||admin.role==="admin";
    const actionButton=(action,user,label,danger=false)=>'<button class="action '+(danger?"danger":"")+'" data-room-action="'+action+'" data-user-id="'+esc(user.user_id)+'">'+label+'</button>';
    const userActions=user=>{
      if(!canManage||user.user_id===data.room.ownerUserId)return '<span class="muted">محمي</span>';
      const isModerator=Number(user.is_moderator)===1;
      const isBanned=Number(user.is_banned)===1;
      if(isBanned)return actionButton("unban",user,"رفع الحظر");
      let html=actionButton(isModerator?"remove_moderator":"assign_moderator",user,isModerator?"إزالة المشرف":"تعيين مشرف");
      if(!isModerator){
        if(Number(user.is_seated)===1)html+=actionButton(Number(user.is_muted)===1?"unmute":"mute",user,Number(user.is_muted)===1?"إلغاء الكتم":"كتم");
        html+=actionButton("kick",user,"طرد دقيقة",true)+actionButton("ban",user,"حظر دائم",true);
      }
      return '<div class="room-tools">'+html+'</div>';
    };
    const userName=user=>esc(user.display_name||user.email||user.user_id);
    const memberRows=data.members.length?data.members.map(user=>'<tr><td>'+esc(user.seat_number)+'</td><td>'+userName(user)+'</td><td>'+esc(user.gabo_id||"—")+'</td><td>'+(Number(user.is_muted)===1?'<span class="badge bad">مكتوم</span>':'<span class="badge good">مفتوح</span>')+'</td><td>'+userActions({...user,is_seated:1})+'</td></tr>').join(""):'<tr><td colspan="5" class="empty">لا توجد مقاعد مايك نشطة حاليًا</td></tr>';
    const moderatorRows=data.moderators.length?data.moderators.map(user=>'<tr><td>'+userName(user)+'</td><td>'+esc(user.gabo_id||"—")+'</td><td>'+esc(user.created_at||"—")+'</td><td>'+(canManage?actionButton("remove_moderator",user,"إزالة المشرف",true):"—")+'</td></tr>').join(""):'<tr><td colspan="4" class="empty">لا يوجد مشرفون لهذه الغرفة</td></tr>';
    const banRows=data.bans.length?data.bans.map(user=>'<tr><td>'+userName(user)+'</td><td>'+esc(user.gabo_id||"—")+'</td><td>'+esc(user.created_at||"—")+'</td><td>'+(canManage?actionButton("unban",user,"رفع الحظر"):"—")+'</td></tr>').join(""):'<tr><td colspan="4" class="empty">لا توجد حسابات محظورة من هذه الغرفة</td></tr>';
    const kickRows=data.kicks.length?data.kicks.map(user=>'<tr><td>'+userName(user)+'</td><td>'+esc(user.gabo_id||"—")+'</td><td>'+esc(user.kicked_until||"—")+'</td></tr>').join(""):'<tr><td colspan="3" class="empty">لا يوجد طرد مؤقت نشط</td></tr>';
    const searchRows=(data.userResults||[]).length?data.userResults.map(user=>'<tr><td>'+userName(user)+'</td><td>'+esc(user.gabo_id||"—")+'</td><td>'+userActions(user)+'</td></tr>').join(""):'<tr><td colspan="3" class="empty">'+(q.length>=2?"لا توجد نتائج مطابقة":"اكتب حرفين على الأقل للبحث عن مستخدم")+'</td></tr>';
    root.innerHTML=
      '<div class="section"><div class="section-head"><h2>إدارة الغرفة: '+esc(data.room.name||roomName)+'</h2><button class="action" id="closeRoomModeration">إغلاق</button></div>'+
      '<p class="muted">الإدارة تشمل مقاعد المايك النشطة والبحث عن حسابات المنصة. الطرد مؤقت لمدة دقيقة، والحظر يستمر حتى رفعه يدويًا.</p>'+
      '<div class="notice">قائمة الأعضاء أدناه تعرض أصحاب مقاعد المايك النشطة. استخدم البحث للوصول إلى حساب آخر وإدارة دخوله لهذه الغرفة.</div></div>'+
      '<div class="section"><h2>مقاعد المايك النشطة ('+data.members.length+')</h2><div class="table-wrap"><table><thead><tr><th>المقعد</th><th>المستخدم</th><th>المعرف</th><th>الصوت</th><th>الإجراءات</th></tr></thead><tbody>'+memberRows+'</tbody></table></div></div>'+
      '<div class="section"><h2>مشرفو الغرفة ('+data.moderators.length+')</h2><div class="table-wrap"><table><thead><tr><th>المستخدم</th><th>المعرف</th><th>تاريخ التعيين</th><th>الإجراء</th></tr></thead><tbody>'+moderatorRows+'</tbody></table></div></div>'+
      '<div class="section"><h2>الحظر ('+data.bans.length+')</h2><div class="table-wrap"><table><thead><tr><th>المستخدم</th><th>المعرف</th><th>تاريخ الحظر</th><th>الإجراء</th></tr></thead><tbody>'+banRows+'</tbody></table></div></div>'+
      '<div class="section"><h2>الطرد المؤقت ('+data.kicks.length+')</h2><div class="table-wrap"><table><thead><tr><th>المستخدم</th><th>المعرف</th><th>ينتهي في</th></tr></thead><tbody>'+kickRows+'</tbody></table></div></div>'+
      '<div class="section"><h2>البحث عن مستخدم وإدارته</h2><form id="roomUserSearchForm" class="room-tools" style="margin:14px 0"><input class="search" id="roomUserQuery" value="'+esc(q)+'" placeholder="الاسم أو البريد أو معرف Happy Live" style="max-width:360px"><button class="action" type="submit">بحث</button></form><div class="table-wrap"><table><thead><tr><th>المستخدم</th><th>المعرف</th><th>الإجراءات</th></tr></thead><tbody>'+searchRows+'</tbody></table></div></div>';
    $("closeRoomModeration").onclick=()=>{root.innerHTML=""};
    $("roomUserSearchForm").onsubmit=e=>{e.preventDefault();loadRoomModeration(roomId,roomName,$("roomUserQuery").value.trim())};
    document.querySelectorAll("[data-room-action]").forEach(button=>button.onclick=async()=>{
      const action=button.dataset.roomAction,targetUserId=button.dataset.userId;
      const labels={assign_moderator:"تعيين مشرف الغرفة",remove_moderator:"إزالة مشرف الغرفة",kick:"طرد المستخدم لمدة دقيقة",ban:"حظر المستخدم من الغرفة",unban:"رفع الحظر",mute:"كتم مايك المستخدم",unmute:"إلغاء كتم المايك"};
      if(!confirm("تأكيد: "+(labels[action]||"تنفيذ الإجراء")+"؟"))return;
      const reason=action==="ban"?(window.prompt("سبب الحظر (اختياري)")||"").trim():"";
      try{
        await api("/admin/rooms/"+encodeURIComponent(roomId)+"/moderation",{method:"POST",body:JSON.stringify({action,targetUserId,reason})});
        await loadRoomModeration(roomId,roomName,q);
      }catch(error){alert(error.message)}
    });
    root.scrollIntoView({behavior:"smooth",block:"start"});
  }catch(error){root.innerHTML='<div class="section"><p class="error">'+esc(error.message)+'</p></div>'}
}

function audit(a){$("content").innerHTML='<div class="section"><div class="section-head"><h2>آخر الإجراءات ('+a.length+')</h2></div><div class="table-wrap"><table><thead><tr><th>الإجراء</th><th>المدير</th><th>النوع</th><th>المعرف</th><th>التاريخ</th></tr></thead><tbody>'+(a.length?a.map(x=>'<tr><td>'+esc(x.action)+'</td><td>'+esc(x.actor_name||x.actor_email||"—")+'</td><td>'+esc(x.target_type)+'</td><td>'+esc(x.target_id)+'</td><td>'+esc(new Date(x.created_at).toLocaleString("ar"))+'</td></tr>').join(""):'<tr><td colspan="5" class="empty">لا توجد إجراءات</td></tr>')+'</tbody></table></div></div>'}
startup();
</script></body></html>
