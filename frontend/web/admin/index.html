<div id="loginView" class="login-wrap"><form id="setupForm" class="login hidden"><div class="logo">H</div><h1>إنشاء كلمة مرور المدير</h1><p class="muted">إعداد أول مرة لحساب المالك المستقل</p><label class="field">رمز التهيئة لمرة واحدة<input id="setupToken" type="password" autocomplete="off" required></label><label class="field">كلمة المرور الجديدة<input id="setupPassword" type="password" autocomplete="new-password" minlength="12" required></label><label class="field">تأكيد كلمة المرور<input id="setupConfirmation" type="password" autocomplete="new-password" minlength="12" required></label><button class="primary" id="setupBtn">إنشاء كلمة المرور</button><div id="setupError" class="error"></div><p class="muted" style="font-size:12px">استخدم 12 حرفًا على الأقل. لا تشارك كلمة المرور مع أي شخص.</p></form><form id="loginForm" class="login"><div class="logo">H</div><h1>لوحة إدارة Happy Live</h1><p class="muted">دخول المالك المستقل</p><label class="field">اسم المستخدم<input id="username" type="text" autocomplete="username" required></label><label class="field">كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" id="loginBtn">تسجيل الدخول</button><div id="loginError" class="error"></div><p class="muted" style="font-size:12px">حساب الإدارة مستقل عن حسابات مستخدمي التطبيق.</p></form></div>

<script>
const API="https://happy-live-api.taher616270.workers.dev/api/v1";let token=sessionStorage.getItem("happy_live_admin_token")||"",admin=null,page="overview";
const $=id=>document.getElementById(id);function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function api(path,opt){opt=opt||{};let r=await fetch(API+path,{method:opt.method||"GET",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:opt.body});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw Error(d.message||d.error||"تعذر تنفيذ الطلب");return d}
function login(msg){$("loginView").classList.remove("hidden");$("appView").classList.add("hidden");$("loginError").textContent=msg||""}

async function startup(){
  try{
    const response=await fetch(API+"/admin/auth/setup-status",{cache:"no-store"});
    const status=await response.json();
    if(!response.ok)throw Error(status.error||"تعذر التحقق من حالة إعداد المدير");
    if(status.setupRequired){
      $("loginForm").classList.add("hidden");
      $("setupForm").classList.remove("hidden");
      $("appView").classList.add("hidden");
      return;
    }
    $("setupForm").classList.add("hidden");
    await verify();
  }catch(e){login(e.message)}
}
$("setupForm").onsubmit=async e=>{
  e.preventDefault();
  const btn=$("setupBtn");btn.disabled=true;$("setupError").textContent="";
  try{
    const response=await fetch(API+"/admin/auth/setup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      setupToken:$("setupToken").value.trim(),
      password:$("setupPassword").value,
      confirmation:$("setupConfirmation").value
    })});
    const data=await response.json();
    if(!response.ok)throw Error(data.message||data.error||"تعذر إنشاء كلمة المرور");
    $("setupForm").classList.add("hidden");
    $("loginForm").classList.remove("hidden");
    $("username").value="owner";
    $("password").value="";
    $("loginError").textContent="تم إنشاء كلمة المرور بنجاح. سجّل الدخول الآن.";
    $("setupToken").value="";$("setupPassword").value="";$("setupConfirmation").value="";
  }catch(error){$("setupError").textContent=error.message}
  finally{btn.disabled=false}
};
function app(){
  $("loginView").classList.add("hidden");$("appView").classList.remove("hidden");
  const roleNames={owner:"مالك",admin:"مدير",moderator:"مشرف للقراءة فقط"};
  $("adminIdentity").textContent=admin.name+" · "+admin.username+" · "+(roleNames[admin.role]||"دور غير معروف");
  const m=document.querySelector('[data-page="moderators"]');if(m)m.classList.toggle("hidden",admin.role!=="owner");
  const a=document.querySelector('[data-page="agora"]');if(a)a.classList.toggle("hidden",admin.role==="moderator");
}
async function verify(){if(!token)return login();try{admin=(await api("/admin/me")).admin;app();await render()}catch(e){token="";sessionStorage.removeItem("happy_live_admin_token");login(e.message)}}
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginBtn").disabled=true;try{let r=await fetch(API+"/admin/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("username").value.trim(),password:$("password").value})});let d=await r.json();if(!r.ok)throw Error(d.message||"بيانات الدخول غير صحيحة");token=d.accessToken;sessionStorage.setItem("happy_live_admin_token",token);admin=(await api("/admin/me")).admin;app();await render()}catch(x){token="";sessionStorage.removeItem("happy_live_admin_token");login(x.message)}finally{$("loginBtn").disabled=false}};
$("logoutBtn").onclick=async()=>{try{await api("/admin/auth/logout",{method:"POST"})}catch(e){}token="";sessionStorage.removeItem("happy_live_admin_token");login()};
const drawer=$("adminDrawer"),drawerOverlay=$("drawerOverlay"),menuToggle=$("menuToggle");function setDrawer(open){if(!drawer||!drawerOverlay||!menuToggle)return;const mobile=window.matchMedia("(max-width:700px)").matches;if(!mobile){drawer.classList.remove("drawer-open");drawerOverlay.classList.remove("visible");menuToggle.setAttribute("aria-expanded","false");return}drawer.classList.toggle("drawer-open",open);drawerOverlay.classList.toggle("visible",open);drawerOverlay.setAttribute("aria-hidden",String(!open));menuToggle.setAttribute("aria-expanded",String(open));menuToggle.setAttribute("aria-label",open?"إغلاق القائمة":"فتح القائمة");menuToggle.innerHTML=open?'<span aria-hidden="true">×</span>':'<span aria-hidden="true">☰</span>';document.body.style.overflow=open?"hidden":""}menuToggle?.addEventListener("click",()=>setDrawer(!drawer.classList.contains("drawer-open")));drawerOverlay?.addEventListener("click",()=>setDrawer(false));document.addEventListener("keydown",e=>{if(e.key==="Escape")setDrawer(false)});window.addEventListener("resize",()=>{if(!window.matchMedia("(max-width:700px)").matches)setDrawer(false)});document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-page]").forEach(x=>x.classList.toggle("active",x===b));page=b.dataset.page;render();setDrawer(false)});setDrawer(false);
function metric(label,n){return '<div class="card"><span>'+label+'</span><strong>'+Number(n||0).toLocaleString("en-US")+'</strong></div>'}

  $("pageTitle").textContent=names[page]||"لوحة الإدارة";$("content").innerHTML='<div class="loading">جارٍ تحميل البيانات…</div>';
  try{
    if(page==="overview"){
      const [overviewResponse,statsResponse]=await Promise.all([api("/admin/overview"),api("/admin/stats")]);
      const o=overviewResponse.overview||{},stats=statsResponse.stats||{},summary=stats.summary||{};
      let chartMode="users";
      $("content").innerHTML=
        '<div class="dashboard-head"><div><h2>الصفحة الرئيسية</h2><p class="muted">إحصائيات عامة من بيانات Happy Live الفعلية</p></div><div class="dashboard-actions"><button class="action" id="dashboardFilter">تصفية الرسم</button><button class="action" id="dashboardRefresh">↻ تحديث</button></div></div>'+

          root.innerHTML='<div class="dashboard-stats-grid">'+
            card("♙","إجمالي المستخدمين",o.users?.total)+
            card("●","المستخدمون النشطون",o.users?.active)+
            card("◉","إجمالي الغرف",o.rooms?.total)+

      $("dashboardRefresh").onclick=()=>render();

    }
    else if(page==="stats")statsPage((await api("/admin/stats")).stats);
    else if(page==="users")users((await api("/admin/users")).users||[]);

    else if(page==="reports")await roomReportsPage();

  }catch(e){$("content").innerHTML='<div class="section"><p class="error">'+esc(e.message)+'</p><p class="muted">تحقق من صلاحية حسابك الإداري واتصال الخادم.</p></div>'}
}

async function walletsPage(q="",selectedUserId=""){
  const query="/admin/wallets?q="+encodeURIComponent(q)+"&limit=100"+(selectedUserId?"&userId="+encodeURIComponent(selectedUserId):"");
  const data=await api(query),summary=data.summary||{},rows=data.wallets||[],selected=data.selectedWallet;
  const canCredit=admin.role==="owner";

  const history=(data.transactions||[]).map(t=>'<tr><td>'+esc(t.description||t.type||"حركة رصيد")+'</td><td><span class="badge '+(Number(t.amount)>=0?"good":"bad")+'">'+(Number(t.amount)>=0?"+":"")+fmt(t.amount)+'</span></td><td>'+fmt(t.balanceAfter)+'</td><td>'+esc(new Date(t.createdAt).toLocaleString("ar"))+'</td></tr>').join("")||'<tr><td colspan="4" class="empty">لا توجد حركات مسجلة لهذا المستخدم</td></tr>';
  $("content").innerHTML=
    '<div class="cards">'+metric("عدد الحسابات النشطة",summary.users)+metric("إجمالي العملات في المحافظ",summary.totalBalance)+metric("حسابات لديها رصيد",summary.fundedUsers)+'</div>'+
    '<div class="section"><div class="section-head"><div><h2>الكوينز والمحافظ</h2><p class="muted">أرصدة العملات وسجل الحركات محفوظة في قاعدة بيانات المنصة.</p></div><input id="walletSearch" class="search" value="'+esc(q)+'" placeholder="ابحث بالاسم أو البريد أو ID"></div>'+
    '<div class="notice">'+(canCredit?"إضافة العملات اليدوية متاحة للمالك فقط، وتسجل كل عملية في سجل الإدارة.":"عرض فقط: إضافة العملات متاحة لمالك التطبيق فقط.")+' الشحن الإلكتروني عبر بوابة دفع غير مفعّل بعد.</div>'+
    '<div class="table-wrap"><table><thead><tr><th>المستخدم</th><th>Happy ID</th><th>البريد</th><th>الرصيد</th><th>آخر تحديث</th><th>الإجراءات</th></tr></thead><tbody>'+
    (rows.length?rows.map(u=>'<tr><td>'+esc(u.display_name||"مستخدم")+'</td><td>'+esc(u.gabo_id||"—")+'</td><td>'+esc(u.email||"—")+'</td><td><strong>'+fmt(u.balance)+'</strong></td><td>'+esc(u.updated_at?new Date(u.updated_at).toLocaleString("ar"):"—")+'</td><td><div class="room-tools"><button class="action" data-wallet-history="'+esc(u.id)+'">السجل</button>'+(canCredit?'<button class="action" data-wallet-credit="'+esc(u.id)+'">إضافة عملات</button>':"")+'</div></td></tr>').join(""):'<tr><td colspan="6" class="empty">لا توجد حسابات مطابقة</td></tr>')+
    '</tbody></table></div></div>'+
    (selected?'<div class="section"><div class="section-head"><div><h2>سجل محفظة '+esc(selected.display_name||"المستخدم")+'</h2><p class="muted">ID: '+esc(selected.gabo_id||"—")+' · الرصيد الحالي: '+fmt(selected.balance)+' عملة</p></div><button class="action" id="walletHistoryClose">إغلاق السجل</button></div><div class="table-wrap"><table><thead><tr><th>البيان</th><th>قيمة الحركة</th><th>الرصيد بعدها</th><th>التاريخ</th></tr></thead><tbody>'+history+'</tbody></table></div></div>':"");
  let timer;
  $("walletSearch").oninput=e=>{clearTimeout(timer);const value=e.target.value.trim();timer=setTimeout(()=>walletsPage(value,selectedUserId),250)};
  document.querySelectorAll("[data-wallet-history]").forEach(b=>b.onclick=()=>walletsPage(q,b.dataset.walletHistory));
  document.querySelectorAll("[data-wallet-credit]").forEach(b=>b.onclick=async()=>{
    const raw=window.prompt("كم عدد العملات التي تريد إضافتها؟");
    if(raw===null)return;
    const amount=Number(raw.trim());
    if(!Number.isSafeInteger(amount)||amount<1||amount>1000000000){alert("أدخل عدد عملات صحيحًا أكبر من صفر.");return}
    if(!confirm("تأكيد إضافة "+fmt(amount)+" عملة إلى محفظة هذا المستخدم؟"))return;
    b.disabled=true;
    try{
      const result=await api("/admin/users/"+b.dataset.walletCredit+"/wallet/credit",{method:"POST",body:JSON.stringify({amount})});
      alert("تمت إضافة "+fmt(result.credited)+" عملة. الرصيد الجديد: "+fmt(result.balance));
      await walletsPage(q,selectedUserId);

  });
  $("walletHistoryClose")?.addEventListener("click",()=>walletsPage(q));
}
async function roomReportsPage(status="pending"){

  '</tbody></table></div></div>';
  $("reportStatus").onchange=e=>roomReportsPage(e.target.value);

  document.querySelectorAll("[data-room-report]").forEach(button=>button.onclick=async()=>{
    const next=button.dataset.status;

    button.disabled=true;

}

      const label=u.admin_role==="owner"?"مالك":u.admin_role==="admin"?"مدير تطبيق":u.admin_role==="moderator"?"مشرف":"مستخدم";
      let action="";if(u.status==="active"&&u.admin_role!=="owner")action=u.admin_role?'<button class="action danger" data-role-user="'+esc(u.id)+'" data-next-role="null">إزالة الدور</button>':'<button class="action" data-role-user="'+esc(u.id)+'" data-next-role="moderator">مشرف</button> <button class="action" data-role-user="'+esc(u.id)+'" data-next-role="admin">مدير</button>';
      return '<tr><td>'+esc(u.display_name||"—")+'</td><td>'+esc(u.email)+'</td><td>'+esc(u.gabo_id||"—")+'</td><td>'+label+'</td><td>'+action+'</td></tr>';
    }).join(""):'<tr><td colspan="5" class="empty">لا توجد نتائج</td></tr>';
    document.querySelectorAll("[data-role-user]").forEach(b=>b.onclick=async()=>{const next=b.dataset.nextRole==="null"?null:b.dataset.nextRole;if(!confirm(next?"تأكيد تعيين هذا الدور؟":"تأكيد إزالة دور الإدارة عن المستخدم؟"))return;b.disabled=true;try{await api("/admin/users/"+b.dataset.roleUser+"/role",{method:"PATCH",body:JSON.stringify({role:next})});await render()}catch(e){alert(e.message);b.disabled=false}});
  };
  draw((await api("/admin/users?limit=100")).users||[]);
  let timer;$("moderatorSearch").oninput=e=>{clearTimeout(timer);const q=e.target.value.trim();timer=setTimeout(async()=>{try{draw((await api("/admin/users?q="+encodeURIComponent(q)+"&limit=100")).users||[])}catch(err){$("moderatorCandidates").innerHTML='<tr><td colspan="5" class="empty">'+esc(err.message)+'</td></tr>'}},250)};
}
function users(a){
  $("content").innerHTML='<div class="section"><div class="section-head"><h2>المستخدمون ('+a.length+')</h2><input id="search" class="search" placeholder="ابحث بالاسم أو البريد أو ID"></div><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>البريد</th><th>ID</th><th>الحالة</th><th>الدور</th><th>الإجراءات</th></tr></thead><tbody id="rows"></tbody></table></div><p class="muted">إيقاف الحساب يمنع استخدامه ويلغي جلساته. الطرد ينهي الجلسات الحالية فقط ولا يمنع تسجيل الدخول مجددًا.</p></div>';
  const canManage=admin.role==="owner"||admin.role==="admin";
  const draw=list=>{
    $("rows").innerHTML=list.length?list.map(u=>{
      const protectedRole=!!u.admin_role&&admin.role!=="owner",canAct=canManage&&!protectedRole&&u.status!=="deleted";
      const label=u.status==="active"?"نشط":u.status==="suspended"?"محظور":"محذوف";
      const actions=canAct?'<button class="action '+(u.status==="active"?"danger":"")+'" data-status-id="'+esc(u.id)+'" data-status-next="'+(u.status==="active"?"suspended":"active")+'">'+(u.status==="active"?"حظر الحساب":"رفع الحظر")+'</button> <button class="action" data-kick-id="'+esc(u.id)+'">طرد الجلسات</button>':"—";
      return '<tr><td>'+esc(u.display_name||"—")+'</td><td>'+esc(u.email)+'</td><td>'+esc(u.gabo_id||"—")+'</td><td><span class="badge '+(u.status==="active"?"good":"bad")+'">'+label+'</span></td><td>'+esc(u.admin_role||"مستخدم")+'</td><td>'+actions+'</td></tr>';
    }).join(""):'<tr><td colspan="6" class="empty">لا توجد نتائج</td></tr>';
    document.querySelectorAll("[data-status-id]").forEach(b=>b.onclick=async()=>{const next=b.dataset.statusNext;if(!confirm(next==="suspended"?"سيتم حظر الحساب وإنهاء جلساته وإخراجه من الغرف. متابعة؟":"تأكيد رفع الحظر عن الحساب؟"))return;b.disabled=true;try{await api("/admin/users/"+b.dataset.statusId+"/status",{method:"PATCH",body:JSON.stringify({status:next})});await render()}catch(e){alert(e.message);b.disabled=false}});
    document.querySelectorAll("[data-kick-id]").forEach(b=>b.onclick=async()=>{if(!confirm("سيتم إنهاء جميع جلسات المستخدم الحالية وإخراجه من الغرف. يمكنه تسجيل الدخول مجددًا. متابعة؟"))return;b.disabled=true;try{const r=await api("/admin/users/"+b.dataset.kickId+"/kick",{method:"POST"});alert("تم إنهاء الجلسات الحالية: "+Number(r.revokedSessions||0));await render()}catch(e){alert(e.message);b.disabled=false}});
  };
  draw(a);let timer;$("search").oninput=e=>{clearTimeout(timer);const q=e.target.value.trim();timer=setTimeout(async()=>{try{draw((await api("/admin/users?q="+encodeURIComponent(q)+"&limit=100")).users||[])}catch(err){$("rows").innerHTML='<tr><td colspan="6" class="empty">'+esc(err.message)+'</td></tr>'}},250)};
}
function rooms(a){
  const canManage=admin.role==="owner"||admin.role==="admin";
  $("content").innerHTML='<div class="section"><div class="section-head"><h2>الغرف ('+a.length+')</h2></div><div class="table-wrap"><table><thead><tr><th>الغرفة</th><th>رقمها</th><th>المالك</th><th>الخصوصية</th><th>الحالة</th><th>الإجراء</th></tr></thead><tbody>'+
    (a.length?a.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+esc(r.room_code)+'</td><td>'+esc(r.owner_name||"—")+'</td><td>'+(r.visibility==="private"?"خاصة":"عامة")+'</td><td><span class="badge '+(r.status==="active"?"good":"bad")+'">'+(r.status==="active"?"نشطة":"مغلقة")+'</span></td><td><div class="room-tools"><button class="action" data-room-open="'+esc(r.id)+'" data-room-name="'+esc(r.name)+'">إدارة الغرفة</button>'+
    (canManage?'<button class="action '+(r.status==="active"?"danger":"")+'" data-room-status="'+esc(r.id)+'" data-next="'+(r.status==="active"?"closed":"active")+'">'+(r.status==="active"?"إغلاق":"فتح")+'</button>':'<span class="muted">قراءة فقط</span>')+
    '</div></td></tr>').join(""):'<tr><td colspan="6" class="empty">لا توجد غرف</td></tr>')+
    '</tbody></table></div></div><div id="roomModeration"></div>';
  document.querySelectorAll("[data-room-open]").forEach(b=>b.onclick=()=>loadRoomModeration(b.dataset.roomOpen,b.dataset.roomName||"الغرفة"));
  document.querySelectorAll("[data-room-status]").forEach(b=>b.onclick=async()=>{
    if(!confirm("تأكيد تغيير حالة الغرفة؟"))return;
    try{await api("/admin/rooms/"+b.dataset.roomStatus+"/status",{method:"PATCH",body:JSON.stringify({status:b.dataset.next})});render()}
    catch(e){alert(e.message)}
  });
}
async function loadRoomModeration(roomId,roomName,q=""){
  const root=$("roomModeration");if(!root)return;
  root.innerHTML='<div class="section"><div class="loading">جارٍ تحميل إدارة الغرفة…</div></div>';
  try{
    const endpoint="/admin/rooms/"+encodeURIComponent(roomId)+"/moderation"+(q?"?q="+encodeURIComponent(q):"");
    const data=await api(endpoint);
    const canManage=admin.role==="owner"||admin.role==="admin";
    const actionButton=(action,user,label,danger=false)=>'<button class="action '+(danger?"danger":"")+'" data-room-action="'+action+'" data-user-id="'+esc(user.user_id)+'">'+label+'</button>';
    const userActions=user=>{
      if(!canManage||user.user_id===data.room.ownerUserId)return '<span class="muted">محمي</span>';
      const isModerator=Number(user.is_moderator)===1;
      const isBanned=Number(user.is_banned)===1;
      if(isBanned)return actionButton("unban",user,"رفع الحظر");
      let html=actionButton(isModerator?"remove_moderator":"assign_moderator",user,isModerator?"إزالة المشرف":"تعيين مشرف");
      if(!isModerator){
        if(Number(user.is_seated)===1)html+=actionButton(Number(user.is_muted)===1?"unmute":"mute",user,Number(user.is_muted)===1?"إلغاء الكتم":"كتم");
        html+=actionButton("kick",user,"طرد دقيقة",true)+actionButton("ban",user,"حظر دائم",true);
      }
      return '<div class="room-tools">'+html+'</div>';
    };
    const userName=user=>esc(user.display_name||user.email||user.user_id);
    const memberRows=data.members.length?data.members.map(user=>'<tr><td>'+esc(user.seat_number)+'</td><td>'+userName(user)+'</td><td>'+esc(user.gabo_id||"—")+'</td><td>'+(Number(user.is_muted)===1?'<span class="badge bad">مكتوم</span>':'<span class="badge good">مفتوح</span>')+'</td><td>'+userActions({...user,is_seated:1})+'</td></tr>').join(""):'<tr><td colspan="5" class="empty">لا توجد مقاعد مايك نشطة حاليًا</td></tr>';
    const moderatorRows=data.moderators.length?data.moderators.map(user=>'<tr><td>'+userName(user)+'</td><td>'+esc(user.gabo_id||"—")+'</td><td>'+esc(user.created_at||"—")+'</td><td>'+(canManage?actionButton("remove_moderator",user,"إزالة المشرف",true):"—")+'</td></tr>').join(""):'<tr><td colspan="4" class="empty">لا يوجد مشرفون لهذه الغرفة</td></tr>';
    const banRows=data.bans.length?data.bans.map(user=>'<tr><td>'+userName(user)+'</td><td>'+esc(user.gabo_id||"—")+'</td><td>'+esc(user.created_at||"—")+'</td><td>'+(canManage?actionButton("unban",user,"رفع الحظر"):"—")+'</td></tr>').join(""):'<tr><td colspan="4" class="empty">لا توجد حسابات محظورة من هذه الغرفة</td></tr>';
    const kickRows=data.kicks.length?data.kicks.map(user=>'<tr><td>'+userName(user)+'</td><td>'+esc(user.gabo_id||"—")+'</td><td>'+esc(user.kicked_until||"—")+'</td></tr>').join(""):'<tr><td colspan="3" class="empty">لا يوجد طرد مؤقت نشط</td></tr>';
    const searchRows=(data.userResults||[]).length?data.userResults.map(user=>'<tr><td>'+userName(user)+'</td><td>'+esc(user.gabo_id||"—")+'</td><td>'+userActions(user)+'</td></tr>').join(""):'<tr><td colspan="3" class="empty">'+(q.length>=2?"لا توجد نتائج مطابقة":"اكتب حرفين على الأقل للبحث عن مستخدم")+'</td></tr>';
    root.innerHTML=
      '<div class="section"><div class="section-head"><h2>إدارة الغرفة: '+esc(data.room.name||roomName)+'</h2><button class="action" id="closeRoomModeration">إغلاق</button></div>'+
      '<p class="muted">الإدارة تشمل مقاعد المايك النشطة والبحث عن حسابات المنصة. الطرد مؤقت لمدة دقيقة، والحظر يستمر حتى رفعه يدويًا.</p>'+
      '<div class="notice">قائمة الأعضاء أدناه تعرض أصحاب مقاعد المايك النشطة. استخدم البحث للوصول إلى حساب آخر وإدارة دخوله لهذه الغرفة.</div></div>'+
      '<div class="section"><h2>مقاعد المايك النشطة ('+data.members.length+')</h2><div class="table-wrap"><table><thead><tr><th>المقعد</th><th>المستخدم</th><th>المعرف</th><th>الصوت</th><th>الإجراءات</th></tr></thead><tbody>'+memberRows+'</tbody></table></div></div>'+
      '<div class="section"><h2>مشرفو الغرفة ('+data.moderators.length+')</h2><div class="table-wrap"><table><thead><tr><th>المستخدم</th><th>المعرف</th><th>تاريخ التعيين</th><th>الإجراء</th></tr></thead><tbody>'+moderatorRows+'</tbody></table></div></div>'+
      '<div class="section"><h2>الحظر ('+data.bans.length+')</h2><div class="table-wrap"><table><thead><tr><th>المستخدم</th><th>المعرف</th><th>تاريخ الحظر</th><th>الإجراء</th></tr></thead><tbody>'+banRows+'</tbody></table></div></div>'+
      '<div class="section"><h2>الطرد المؤقت ('+data.kicks.length+')</h2><div class="table-wrap"><table><thead><tr><th>المستخدم</th><th>المعرف</th><th>ينتهي في</th></tr></thead><tbody>'+kickRows+'</tbody></table></div></div>'+
      '<div class="section"><h2>البحث عن مستخدم وإدارته</h2><form id="roomUserSearchForm" class="room-tools" style="margin:14px 0"><input class="search" id="roomUserQuery" value="'+esc(q)+'" placeholder="الاسم أو البريد أو معرف Happy Live" style="max-width:360px"><button class="action" type="submit">بحث</button></form><div class="table-wrap"><table><thead><tr><th>المستخدم</th><th>المعرف</th><th>الإجراءات</th></tr></thead><tbody>'+searchRows+'</tbody></table></div></div>';
    $("closeRoomModeration").onclick=()=>{root.innerHTML=""};
    $("roomUserSearchForm").onsubmit=e=>{e.preventDefault();loadRoomModeration(roomId,roomName,$("roomUserQuery").value.trim())};
    document.querySelectorAll("[data-room-action]").forEach(button=>button.onclick=async()=>{
      const action=button.dataset.roomAction,targetUserId=button.dataset.userId;
      const labels={assign_moderator:"تعيين مشرف الغرفة",remove_moderator:"إزالة مشرف الغرفة",kick:"طرد المستخدم لمدة دقيقة",ban:"حظر المستخدم من الغرفة",unban:"رفع الحظر",mute:"كتم مايك المستخدم",unmute:"إلغاء كتم المايك"};
      if(!confirm("تأكيد: "+(labels[action]||"تنفيذ الإجراء")+"؟"))return;
      const reason=action==="ban"?(window.prompt("سبب الحظر (اختياري)")||"").trim():"";
      try{
        await api("/admin/rooms/"+encodeURIComponent(roomId)+"/moderation",{method:"POST",body:JSON.stringify({action,targetUserId,reason})});
        await loadRoomModeration(roomId,roomName,q);
      }catch(error){alert(error.message)}
    });
    root.scrollIntoView({behavior:"smooth",block:"start"});
  }catch(error){root.innerHTML='<div class="section"><p class="error">'+esc(error.message)+'</p></div>'}
}

function audit(a){$("content").innerHTML='<div class="section"><div class="section-head"><h2>آخر الإجراءات ('+a.length+')</h2></div><div class="table-wrap"><table><thead><tr><th>الإجراء</th><th>المدير</th><th>النوع</th><th>المعرف</th><th>التاريخ</th></tr></thead><tbody>'+(a.length?a.map(x=>'<tr><td>'+esc(x.action)+'</td><td>'+esc(x.actor_name||x.actor_email||"—")+'</td><td>'+esc(x.target_type)+'</td><td>'+esc(x.target_id)+'</td><td>'+esc(new Date(x.created_at).toLocaleString("ar"))+'</td></tr>').join(""):'<tr><td colspan="5" class="empty">لا توجد إجراءات</td></tr>')+'</tbody></table></div></div>'}
startup();
</script></body></html>
