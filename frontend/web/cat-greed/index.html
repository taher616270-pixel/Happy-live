<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09080d"><title>قط الجشع | Happy Live</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#33233c,#09080d 70%);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#17131f;border:1px solid #46384e;border-radius:18px;padding:16px;margin:12px 0}.hidden{display:none!important}input,button{font:inherit}input{width:100%;padding:12px;border-radius:10px;background:#0b0911;border:1px solid #514260;color:white;margin:7px 0}button{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:#d4af37;color:#20170a;font-weight:800}.muted{color:#c4b8ce}.error{color:#ff9ba8}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.wheel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px auto;max-width:560px}.slot{min-height:116px;background:#fff3c4;color:#5a3a00;border:3px solid #b67a39;border-radius:50%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;position:relative}.slot .emoji{font-size:30px}.slot .pool{font-size:12px}.slot.hit{background:#c4ffbf;box-shadow:0 0 22px #4de06a;transform:scale(1.04)}.chips{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.chips button{background:#243a9b;color:#fff;border:2px solid #fff}.chips button.active{background:#d4af37;color:#211}.msg{color:#ffdf78;text-align:center;min-height:26px}.history{display:flex;gap:9px;flex-wrap:wrap;font-size:22px}.field{display:block}.small{font-size:12px}@media(max-width:480px){.slot{min-height:90px}.slot .emoji{font-size:24px}}
</style></head><body><main class="wrap">
<section id="login" class="card"><h1>🐱 قط الجشع</h1><p class="muted">سجّل الدخول بحساب Happy Live للعب.</p><form id="loginForm"><label class="field">البريد الإلكتروني<input id="email" type="email" autocomplete="username" required></label><label class="field">كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label><button>دخول</button><p id="loginError" class="error"></p></form></section>
<section id="game" class="hidden"><header class="head"><h1>🐱 قط الجشع</h1><div>🪙 <b id="balance">0</b> <button id="logout" class="small">خروج</button></div></header>
<div class="card"><div class="head"><b id="round">الجولة —</b><b id="phase">—</b><b id="timer">—</b></div><div id="wheel" class="wheel"></div><p id="notice" class="msg"></p><div class="chips" id="chips"></div><p class="muted small">اختر قيمة الرهان ثم اضغط الرمز. تُحسم الجولة على الخادم بعد إغلاق الرهان، وتُكشف النتيجة للجميع في الوقت نفسه.</p></div>
<div class="card"><b>نتائج الجولات السابقة</b><div id="history" class="history"></div></div><p id="error" class="error"></p></section></main>
<script>
const API="https://happy-live-api.taher616270.workers.dev/api/v1",chips=[10,500,6000,30000,100000];let token=sessionStorage.getItem("cat_greed_token")||"",state=null,chip=500,poll=null,animRound="";
const $=id=>document.getElementById(id),headers=()=>({"Content-Type":"application/json","Authorization":"Bearer "+token});
async function req(path,body){const r=await fetch(API+path,{method:body?"POST":"GET",headers:headers(),body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.message||d.error||"تعذر الاتصال");return d}
function login(msg=""){$("login").classList.remove("hidden");$("game").classList.add("hidden");$("loginError").textContent=msg}
$("loginForm").onsubmit=async e=>{e.preventDefault();try{const r=await fetch(API+"/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value.trim(),password:$("password").value})});const d=await r.json();if(!r.ok)throw Error(d.message||"بيانات الدخول غير صحيحة");token=d.accessToken;sessionStorage.setItem("cat_greed_token",token);await start()}catch(e){login(e.message)}};
$("logout").onclick=()=>{token="";sessionStorage.removeItem("cat_greed_token");clearInterval(poll);login()};
function fmt(n){n=Number(n||0);return n>=1e6?(n/1e6).toFixed(2)+"M":n>=1e3?(n/1e3).toFixed(1)+"K":String(n)}
function render(){const s=state;if(!s)return;$("balance").textContent=fmt(s.balance);$("round").textContent="جولة "+s.roundId;$("phase").textContent=s.phase==="betting"?"استقبال الرهانات":"النتيجة";$("timer").textContent=s.secondsLeft+" ث";$("wheel").innerHTML=(s.symbols||[]).map((x,i)=>'<button class="slot" data-slot="'+i+'"><span class="emoji">'+(x.emoji||"🐱")+'</span><b>'+x.multiplier+'x</b><span class="pool">'+fmt(s.pools[i])+' 🪙</span><small>'+fmt(s.myBets[i])+' رهاني</small></button>').join("");document.querySelectorAll("[data-slot]").forEach(b=>b.onclick=()=>bet(Number(b.dataset.slot)));$("history").textContent=(s.history||[]).join("　");if(s.phase==="result")$("notice").textContent=s.special==="salad"?"السلطة 🥗":s.special==="pizza"?"البيتزا 🍕":"الرمز الفائز "+(Number(s.resultSlot)+1);else $("notice").textContent="اختر رمزاً للمراهنة";}
async function refresh(){try{const n=await req("/games/cat-greed/state");if(n.enabled!==true)throw Error("اللعبة متوقفة حالياً");state=n;render();$("error").textContent="";if(n.phase==="result"&&animRound!==String(n.roundId)){animRound=String(n.roundId);animate(n.resultSlot)}}catch(e){$("error").textContent=e.message}}
async function animate(target){if(target==null)return;const nodes=[...document.querySelectorAll("[data-slot]")];let k=0;const total=26+target;const timer=setInterval(()=>{nodes.forEach(n=>n.classList.remove("hit"));nodes[k%8]?.classList.add("hit");k++;if(k>=total){clearInterval(timer);nodes.forEach(n=>n.classList.remove("hit"));nodes[target]?.classList.add("hit")}},90)}
async function bet(slot){if(!state||state.phase!=="betting")return;$("error").textContent="";try{state=await req("/games/cat-greed/bet",{roundId:state.roundId,slot,amount:chip});render()}catch(e){$("error").textContent=e.message;refresh()}}
$("chips").innerHTML=chips.map(v=>'<button data-chip="'+v+'" class="'+(v===chip?"active":"")+'">'+fmt(v)+'</button>').join("");document.querySelectorAll("[data-chip]").forEach(b=>b.onclick=()=>{chip=Number(b.dataset.chip);document.querySelectorAll("[data-chip]").forEach(x=>x.classList.toggle("active",x===b))});
async function start(){try{await req("/auth/me");$("login").classList.add("hidden");$("game").classList.remove("hidden");await refresh();clearInterval(poll);poll=setInterval(refresh,1000)}catch(e){token="";sessionStorage.removeItem("cat_greed_token");login(e.message)}}
if(token)start();
</script></body></html>
