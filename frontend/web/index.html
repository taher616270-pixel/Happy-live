<!DOCTYPE html>
<html lang="ar">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#09080D">
  <meta name="description" content="Happy Live - عالمك الاجتماعي في مكان واحد">
  <title>Happy Live</title>
  <style>
    :root {
      color-scheme: dark;
      background: #09080D;
    }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 85% 0%, rgba(155, 99, 217, 0.15), transparent 42%),
        radial-gradient(ellipse at 10% 100%, rgba(232, 196, 119, 0.08), transparent 38%),
        #09080D;
      overscroll-behavior: none;
    }
    body {
      position: fixed;
      inset: 0;
      -webkit-text-size-adjust: 100%;
    }
    flt-glass-pane {
      background: transparent !important;
    }
    #flutter-view {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* iPhone Safari only. Activated by the Safari-only script below. */
    @supports (-webkit-touch-callout: none) {
      html.safari-ios {
        width: 100%;
        height: -webkit-fill-available;
        overflow: hidden;
      }

      html.safari-ios body {
        inset: 0 auto auto 0;
        width: 100%;
        height: -webkit-fill-available;
        min-height: 0;
        overflow: hidden;
      }

      html.safari-ios flt-glass-pane,
      html.safari-ios #flutter-view {
        display: block;
        width: 100%;
        height: 100%;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.24.8.js"></script>
  <script src="agora_bridge.js"></script>
  <script>
    // Adjust only iPhone Safari to the actually visible browser viewport.
    (() => {
      const ua = navigator.userAgent;
      const isSafari =
        /Safari/i.test(ua) &&
        !/(CriOS|Chrome|Chromium|FxiOS|Firefox|EdgiOS|EdgA|Edg|OPiOS|OPR|DuckDuckGo)/i.test(ua);
      const isIPhone = /iPhone|iPod/i.test(ua);

      if (!isSafari || !isIPhone || !window.visualViewport) return;

      const root = document.documentElement;
      const body = document.body;
      const viewport = window.visualViewport;

      root.classList.add('safari-ios');

      let lastNormalHeight = 0;
      let lastBounds = '';
      let keyboardOpen = false;
      let frame = 0;

      const setViewportBounds = (width, height, top, left, notifyFlutter) => {
        const w = Math.max(1, Math.round(width));
        const h = Math.max(1, Math.round(height));
        const t = Math.round(top);
        const l = Math.round(left);
        const bounds = [w, h, t, l].join(':');

        body.style.top = t + 'px';
        body.style.left = l + 'px';
        body.style.right = 'auto';
        body.style.bottom = 'auto';
        body.style.width = w + 'px';
        body.style.height = h + 'px';
        body.style.minHeight = '0';

        const pane = document.querySelector('flt-glass-pane');
        const flutterView = document.querySelector('#flutter-view');

        if (pane) {
          pane.style.width = '100%';
          pane.style.height = '100%';
        }
        if (flutterView) {
          flutterView.style.width = '100%';
          flutterView.style.height = '100%';
        }

        if (notifyFlutter && bounds !== lastBounds) {
          lastBounds = bounds;
          // Notify Flutter only for real browser-viewport changes, never for keyboard opening.
          window.dispatchEvent(new Event('resize'));
        } else {
          lastBounds = bounds;
        }
      };

      const syncViewport = () => {
        cancelAnimationFrame(frame);
        frame = requestAnimationFrame(() => {
          const visibleHeight = viewport.height;
          const keyboardHeight = window.innerHeight - visibleHeight;
          const keyboardNowOpen = keyboardHeight > 120;

          if (keyboardNowOpen) {
            keyboardOpen = true;
            // Keep the page at its pre-keyboard dimensions.
            return;
          }

          const width = viewport.width;
          const height = visibleHeight;
          const top = viewport.offsetTop;
          const left = viewport.offsetLeft;

          if (!keyboardOpen || !lastNormalHeight) {
            lastNormalHeight = height;
            setViewportBounds(width, height, top, left, true);
          } else {
            // Keyboard closed: restore the current Safari visible viewport.
            keyboardOpen = false;
            lastNormalHeight = height;
            setViewportBounds(width, height, top, left, true);
          }
        });
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', syncViewport, { once: true });
      } else {
        syncViewport();
      }

      viewport.addEventListener('resize', syncViewport, { passive: true });
      viewport.addEventListener('scroll', syncViewport, { passive: true });
      window.addEventListener('resize', syncViewport, { passive: true });
      window.addEventListener('orientationchange', () => {
        keyboardOpen = false;
        lastNormalHeight = 0;
        setTimeout(syncViewport, 300);
      }, { passive: true });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>

</body>
</html>
