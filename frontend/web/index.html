<!DOCTYPE html>
<html lang="ar">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#09080D">
  <meta name="description" content="Happy Live - عالمك الاجتماعي في مكان واحد">
  <title>Happy Live</title>
  <style>
    :root {
      color-scheme: dark;
      background: #09080D;
    }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 85% 0%, rgba(155, 99, 217, 0.15), transparent 42%),
        radial-gradient(ellipse at 10% 100%, rgba(232, 196, 119, 0.08), transparent 38%),
        #09080D;
      overscroll-behavior: none;
    }
    body {
      position: fixed;
      inset: 0;
    }
    flt-glass-pane {
      background: transparent !important;
    }
    #flutter-view {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Chrome on iOS (CriOS) only: keep the Flutter surface aligned to
    // the visible viewport when the software keyboard opens/closes.
    // Safari is deliberately left completely untouched.
    (() => {
      if (!/CriOS\//.test(navigator.userAgent) || !window.visualViewport) return;

      const viewport = window.visualViewport;
      let frame = 0;

      const syncChromeViewport = () => {
        cancelAnimationFrame(frame);
        frame = requestAnimationFrame(() => {
          const height = Math.max(1, Math.round(viewport.height));
          const top = Math.round(viewport.offsetTop);

          document.documentElement.style.height = height + 'px';
          document.body.style.position = 'fixed';
          document.body.style.inset = 'auto 0 auto 0';
          document.body.style.top = top + 'px';
          document.body.style.height = height + 'px';
          document.body.style.minHeight = height + 'px';

          const pane = document.querySelector('flt-glass-pane');
          const flutterView = document.querySelector('#flutter-view');
          if (pane) pane.style.height = height + 'px';
          if (flutterView) flutterView.style.height = height + 'px';
        });
      };

      syncChromeViewport();
      viewport.addEventListener('resize', syncChromeViewport, { passive: true });
      viewport.addEventListener('scroll', syncChromeViewport, { passive: true });
      window.addEventListener('orientationchange', syncChromeViewport, { passive: true });
    })();
  </script>
</body>
</html>
