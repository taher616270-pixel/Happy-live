<!DOCTYPE html>
<html lang="ar">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#09080D">
  <meta name="description" content="Happy Live - عالمك الاجتماعي في مكان واحد">
  <title>Happy Live</title>
  <style>
    :root {
      color-scheme: dark;
      background: #09080D;
      --app-height: 100%;
    }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 85% 0%, rgba(155, 99, 217, 0.15), transparent 42%),
        radial-gradient(ellipse at 10% 100%, rgba(232, 196, 119, 0.08), transparent 38%),
        #09080D;
      overscroll-behavior: none;
    }
    body {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: auto;
      height: var(--app-height);
      min-height: var(--app-height);
    }
    flt-glass-pane {
      display: block;
      width: 100%;
      height: var(--app-height);
      background: transparent !important;
    }
    #flutter-view {
      display: block;
      width: 100%;
      height: var(--app-height);
    }
  </style>
</head>
<body>
  <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.24.8.js"></script>
  <script src="agora_bridge.js"></script>
  <script>
    // Safari on iOS only: size the Flutter surface to the actually visible viewport.
    // Chrome and other browsers keep their existing viewport behavior.
    (() => {
      const ua = navigator.userAgent;
      const isIOS = /iPhone|iPad|iPod/.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isOtherIOSBrowser = /CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
      if (!isIOS || isOtherIOSBrowser || !window.visualViewport) return;

      const viewport = window.visualViewport;
      let frame = 0;
      const syncSafariHeight = () => {
        cancelAnimationFrame(frame);
        frame = requestAnimationFrame(() => {
          const height = Math.max(1, Math.round(viewport.height));
          document.documentElement.style.setProperty('--app-height', height + 'px');
          document.documentElement.style.height = height + 'px';
          document.body.style.height = height + 'px';
          document.body.style.minHeight = height + 'px';
          const pane = document.querySelector('flt-glass-pane');
          const flutterView = document.querySelector('#flutter-view');
          if (pane) pane.style.height = height + 'px';
          if (flutterView) flutterView.style.height = height + 'px';
          window.dispatchEvent(new Event('resize'));
        });
      };

      syncSafariHeight();
      viewport.addEventListener('resize', syncSafariHeight, { passive: true });
      viewport.addEventListener('scroll', syncSafariHeight, { passive: true });
      window.addEventListener('orientationchange', syncSafariHeight, { passive: true });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>

</body>
</html>
