<!DOCTYPE html>
<html lang="ar">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#09080D">
  <meta name="description" content="Happy Live - عالمك الاجتماعي في مكان واحد">
  <title>Happy Live</title>
  <style>
    :root {
      color-scheme: dark;
      background: #09080D;
    }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 85% 0%, rgba(155, 99, 217, 0.15), transparent 42%),
        radial-gradient(ellipse at 10% 100%, rgba(232, 196, 119, 0.08), transparent 38%),
        #09080D;
      overscroll-behavior: none;
    }
    body {
      position: fixed;
      inset: 0;
      -webkit-text-size-adjust: 100%;
    }
    flt-glass-pane {
      background: transparent !important;
    }
    #flutter-view {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* iOS Safari only. The class is added by the Safari-only UA check below. */
    @supports (-webkit-touch-callout: none) {
      html.safari-ios {
        height: -webkit-fill-available;
      }
      html.safari-ios body {
        top: 0;
        left: 0;
        right: 0;
        bottom: auto;
        height: -webkit-fill-available;
        min-height: -webkit-fill-available;
      }
      html.safari-ios flt-glass-pane,
      html.safari-ios #flutter-view {
        display: block;
        width: 100%;
        height: -webkit-fill-available;
      }
    }
  </style>
</head>
<body>
  <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.24.8.js"></script>
  <script src="agora_bridge.js"></script>
  <script>
    // Restrict all viewport handling to Safari on iOS. CriOS/FxiOS/Edge iOS are excluded.
    (() => {
      const ua = navigator.userAgent;
      const isSafari = /Safari/i.test(ua) &&
        !/(CriOS|Chrome|Chromium|FxiOS|Firefox|EdgiOS|EdgA|Edg|OPiOS|OPR|DuckDuckGo)/i.test(ua);
      const isIOS = /iPhone|iPad|iPod/i.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (!isSafari || !isIOS || !window.visualViewport) return;

      document.documentElement.classList.add('safari-ios');

      const viewport = window.visualViewport;
      let fullHeight = 0;
      let frame = 0;
      let keyboardOpen = false;

      const applyHeight = (height) => {
        const value = Math.max(1, Math.round(height)) + 'px';
        document.body.style.height = value;
        document.body.style.minHeight = value;
        const pane = document.querySelector('flt-glass-pane');
        const flutterView = document.querySelector('#flutter-view');
        if (pane) pane.style.height = value;
        if (flutterView) flutterView.style.height = value;
      };

      const measureNaturalHeight = () => {
        // Temporarily let Safari's -webkit-fill-available calculate the full page height.
        document.body.style.removeProperty('height');
        document.body.style.removeProperty('min-height');
        const pane = document.querySelector('flt-glass-pane');
        const flutterView = document.querySelector('#flutter-view');
        if (pane) pane.style.removeProperty('height');
        if (flutterView) flutterView.style.removeProperty('height');
        fullHeight = Math.max(
          1,
          document.body.offsetHeight,
          document.documentElement.clientHeight
        );
        applyHeight(fullHeight);
      };

      const syncKeyboardAndViewport = () => {
        cancelAnimationFrame(frame);
        frame = requestAnimationFrame(() => {
          const visibleHeight = viewport.height;
          const keyboardNowOpen = fullHeight > 0 && (fullHeight - visibleHeight) > 100;

          if (keyboardNowOpen) {
            // Keep the whole Flutter page at its natural height; the keyboard overlays it.
            keyboardOpen = true;
            applyHeight(fullHeight);
            return;
          }

          if (keyboardOpen || fullHeight === 0) {
            keyboardOpen = false;
            measureNaturalHeight();
          }
        });
      };

      const initialMeasure = () => {
        measureNaturalHeight();
        syncKeyboardAndViewport();
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initialMeasure, { once: true });
      } else {
        initialMeasure();
      }

      viewport.addEventListener('resize', syncKeyboardAndViewport, { passive: true });
      viewport.addEventListener('scroll', syncKeyboardAndViewport, { passive: true });
      window.addEventListener('orientationchange', () => {
        keyboardOpen = false;
        fullHeight = 0;
        setTimeout(initialMeasure, 250);
      }, { passive: true });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>

</body>
</html>
