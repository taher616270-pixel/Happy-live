name = "happy-live-api"
main = "src/index.ts"
compatibility_date = "2026-11-03"
workers_dev = true
[previews.vars]
APP_ENV = "preview"

[[previews.d1_databases]]
binding = "DB"
database_name = "happy-live-room-exp-preview-db"
database_id = "7ade3803-97bf-4f6d-9200-48b3dfb0573c"
migrations_dir = "migrations"

[[previews.durable_objects.bindings]]
name = "ROOM_CHAT"
class_name = "RoomChatHub"

[[previews.durable_objects.bindings]]
name = "ROOM_SEATS"
class_name = "RoomSeatsHub"

[vars]
APP_ENV = "production"
GOOGLE_CLIENT_ID = "999298541545-5i0kn2d1emj2rohuvruj4o8ej49ho9kg.apps.googleusercontent.com"

[[d1_databases]]
binding = "DB"
database_name = "happy-live-db"
database_id = "ae09430d-71e9-420b-8362-a8e2bb947dff"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "ROOM_CHAT"
class_name = "RoomChatHub"

[[durable_objects.bindings]]
name = "ROOM_SEATS"
class_name = "RoomSeatsHub"

[[migrations]]
tag = "v1-room-chat"
new_sqlite_classes = ["RoomChatHub"]

[[migrations]]
tag = "v2-room-seats"
new_sqlite_classes = ["RoomSeatsHub"]
