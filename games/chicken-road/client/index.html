<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chicken Road</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- نافذة اللعبة: نسبة 360×545 مثل نافذة التطبيق الأصلي -->
<div id="win">
  <div id="bar">
    <button class="ib" id="bHelp">?</button>
    <button class="ib" id="bMusic">♫</button>
    <button class="ib" id="bLog">≣</button>
    <div id="balpill"><button class="ib sm" id="bSync">↻</button><b id="bal">0</b><i class="coin"></i></div>
    <button class="ib" id="bTop">🏆</button>
  </div>

  <div id="view">
    <div id="road"></div>
    <div id="badge">🔥 <b id="mult">0x</b></div>
    <div id="hint" hidden><b>👆</b><span>اضغط على أي منطقة للانتقال إلى الخطوة التالية</span></div>
    <div id="toast" hidden></div>
  </div>

  <div id="panel">
    <div id="betpill"><button id="clear">✕</button><span>لعب: <b id="betv">0</b></span></div>
    <div id="lbl">Bet/Win Coins</div>
    <div id="chips"></div>
    <div id="actions">
      <button id="go" class="play">لعب</button>
      <div id="diffs"></div>
    </div>
  </div>

  <div id="modal" hidden><div id="sheet"><div id="mtitle"></div><button id="mclose">✕</button><div id="mbody"></div></div></div>
</div>

<!-- الترتيب مهم -->
<script src="../shared/config.js"></script>
<script src="../shared/engine.js"></script>
<script src="../shared/stats.js"></script>
<script src="client-config.js"></script>
<script src="net.js"></script>
<script src="game.js"></script>
</body>
</html>
