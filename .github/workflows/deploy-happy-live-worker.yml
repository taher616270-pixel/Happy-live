name: Deploy Happy Live Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/worker/**"
      - ".github/workflows/deploy-happy-live-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Worker dependencies
        working-directory: backend/worker
        run: npm install

      - name: Type-check Worker
        working-directory: backend/worker
        run: npm run typecheck

      - name: Deploy Worker with Wrangler
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml