name: Deploy Happy Live Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Worker dependencies
        working-directory: backend/worker
        run: npm install

      - name: Type-check Worker
        working-directory: backend/worker
        run: npm run typecheck

      - name: Run Worker tests before touching production
        working-directory: backend/worker
        run: npm test

      - name: Apply room announcement migration
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0012_room_announcement.sql --config wrangler.toml

      - name: Apply D1 database migrations
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0018_post_comment_rate_limits.sql --config wrangler.toml

      - name: Apply room audience presence migration
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0019_room_audience_presence.sql --config wrangler.toml

      - name: Apply room moderation migration
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0013_room_moderation.sql --config wrangler.toml

      - name: Apply room kick records migration
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0015_room_kicks.sql --config wrangler.toml

      - name: Apply independent admin authentication migration
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0020_independent_admin_auth.sql --config wrangler.toml

      - name: Apply one-time admin password setup migration
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0021_admin_password_setup.sql --config wrangler.toml

      - name: Apply global Agora voice switch migration
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0022_global_agora_voice_switch.sql --config wrangler.toml

      - name: Apply server-side admin role migration
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0023_admin_account_roles.sql --config wrangler.toml

      - name: Apply room profile reports migration
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0017_room_profile_reports.sql --config wrangler.toml

      - name: Enforce one active room per account
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0024_one_active_room_per_user.sql --config wrangler.toml

      - name: Apply room upgrade and wallet migration
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0025_room_upgrades_wallet.sql --config wrangler.toml
      - name: Apply persistent room experience migration
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0026_room_experience_progression.sql --config wrangler.toml
      - name: Apply global gift banner threshold migration
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0033_global_gift_banner.sql --config wrangler.toml


      - name: Apply game registry migration
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0039_game_registry.sql --config wrangler.toml

      - name: Apply game registry lifecycle status migration
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0040_game_registry_status.sql --config wrangler.toml
      - name: Permanently remove Food Wheel database objects
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0046_remove_food_wheel.sql --config wrangler.toml

      - name: Deploy Worker with Wrangler
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml