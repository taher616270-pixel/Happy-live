name: Deploy Happy Live Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/worker/**"
      - ".github/workflows/deploy-happy-live-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Worker dependencies
        working-directory: backend/worker
        run: npm install

      - name: Type-check Worker
        working-directory: backend/worker
        run: npm run typecheck

      - name: Apply room announcement migration
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0012_room_announcement.sql --config wrangler.toml

      - name: Apply D1 database migrations
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0018_post_comment_rate_limits.sql --config wrangler.toml

      - name: Apply room audience presence migration
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0019_room_audience_presence.sql --config wrangler.toml

      - name: Apply room moderation migration
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0013_room_moderation.sql --config wrangler.toml

      - name: Apply room kick records migration
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0015_room_kicks.sql --config wrangler.toml

      - name: Apply independent admin authentication migration
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0020_independent_admin_auth.sql --config wrangler.toml

      - name: Apply one-time admin password setup migration
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0021_admin_password_setup.sql --config wrangler.toml

      - name: Apply global Agora voice switch migration
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0022_global_agora_voice_switch.sql --config wrangler.toml

      - name: Apply server-side admin role migration
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0023_admin_account_roles.sql --config wrangler.toml

      - name: Deploy Worker with Wrangler
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml