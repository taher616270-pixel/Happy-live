name: Deploy Cat Greed Worker Preview

on:
  workflow_dispatch:
    inputs:
      confirm_preview_only:
        description: "Confirm this deploy uses only happy-live-room-exp-preview-db and a Worker Preview URL"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cat-greed-worker-preview
  cancel-in-progress: false

jobs:
  preview:
    if: ${{ inputs.confirm_preview_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        run: npm install --no-package-lock
      - name: Typecheck Worker
        run: npm run typecheck
      - name: Run Worker contract tests
        run: npm test
      - name: Confirm Preview D1 migration state
        run: npm run db:preview:list
      - name: Apply only pending Preview D1 migrations
        run: npm run db:preview
      - name: Deploy isolated Worker Preview
        run: npm run preview:deploy
      - name: List Preview secret names (values are never printed)
        run: npm run preview:secrets:list
