name: Deploy Happy Live game registry Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/worker/**"
      - ".github/workflows/deploy-game-registry-worker.yml"

concurrency:
  group: happy-live-game-registry-worker-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Worker dependencies
        run: npm install

      - name: Type-check Worker
        run: npm run typecheck

      - name: Run Worker contract and regression tests
        run: npm test

      - name: Apply additive game registry migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0039_game_registry.sql --config wrangler.toml

      - name: Apply game registry lifecycle status migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0040_game_registry_status.sql --config wrangler.toml

      - name: Apply temporary game sessions migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0041_game_sessions.sql --config wrangler.toml

      - name: Apply game parent-session binding migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0042_game_session_app_binding.sql --config wrangler.toml
      - name: Permanently remove Food Wheel database objects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute happy-live-db --remote --file migrations/0046_remove_food_wheel.sql --config wrangler.toml

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml
