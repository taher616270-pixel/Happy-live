name: Build Happy Live Android APK

on:
  push:
    paths:
      - ".github/workflows/android-apk.yml"
      - "frontend/lib/**"
      - "frontend/assets/**"
      - "frontend/pubspec.yaml"
      - "frontend/pubspec.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate the Android runner only inside this temporary CI checkout.
      # No Android or web source files are committed by this step.
      - name: Generate Android project in CI workspace
        shell: bash
        run: |
          cd frontend
          rm -rf android
          flutter create --platforms=android --org com.happylive --project-name happy_live .

      - name: Set Android compile SDK 37
        shell: bash
        run: |
          cd frontend
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          if not p.exists():
              raise SystemExit("Expected Kotlin Gradle file was not generated")
          s = p.read_text()
          old = "compileSdk = flutter.compileSdkVersion"
          if old in s:
              s = s.replace(old, "compileSdk = 37", 1)
          elif "compileSdk = 37" not in s:
              raise SystemExit("Could not locate Flutter compileSdk declaration")
          p.write_text(s)
          if "compileSdk = 37" not in p.read_text():
              raise SystemExit("compileSdk 37 was not applied")
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:label="happy_live"', 'android:label="Happy Live"')
          permissions = """    <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
          """
          if "android.permission.RECORD_AUDIO" not in s:
              s = s.replace("<application>", permissions + "\n    <application>")
          activity = '''
                  <activity
                      android:name="com.yalantis.ucrop.UCropActivity"
                      android:screenOrientation="portrait"
                      android:theme="@style/Ucrop.CropTheme"
                      android:exported="false" />
          '''
          if "com.yalantis.ucrop.UCropActivity" not in s:
              s = s.replace("</application>", activity + "\n    </application>")
          p.write_text(s)
          PY

      - name: Resolve Flutter dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Patch Agora Android library compile SDK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots = list(Path.home().joinpath(".pub-cache/hosted/pub.dev").glob("agora_rtc_engine-*/android"))
          if not roots:
              raise SystemExit("Agora Android plugin directory was not found in pub cache")
          changed = []
          for root in roots:
              for p in (root / "build.gradle", root / "build.gradle.kts"):
                  if not p.exists():
                      continue
                  text = p.read_text()
                  updated = re.sub(r"(compileSdkVersion\\s+|compileSdk\\s*=\\s*)31\\b", r"\\g<1>36", text)
                  if updated != text:
                      p.write_text(updated)
                      changed.append(str(p))
                  elif re.search(r"compileSdkVersion\\s+31\\b|compileSdk\\s*=\\s*31\\b", text):
                      raise SystemExit(f"Could not patch compileSdk 31 in {p}")
          if not changed:
              raise SystemExit("Agora library compileSdk 31 declaration was not found; refusing to continue with an unpatched native plugin")
          print("Patched Agora compile SDK in:", *changed, sep="\\n - ")
          PY

      - name: Build release APK
        run: |
          cd frontend
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: happy-live-android-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
