name: Deploy Food Wheel Worker

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-food-wheel-worker.yml"
      - "backend/worker/src/**"
      - "backend/worker/tests/**"
      - "frontend/lib/games/food_wheel/**"
      - "backend/worker/wrangler.toml"
      - "backend/worker/package.json"
      - "backend/worker/package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Worker dependencies
        working-directory: backend/worker
        run: npm install

      - name: Type-check Worker
        working-directory: backend/worker
        run: npm run typecheck

      - name: Run Worker tests before deployment
        working-directory: backend/worker
        run: npm test

      - name: Deploy Worker without applying database migrations
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml
