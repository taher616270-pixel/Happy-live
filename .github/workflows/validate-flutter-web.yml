name: Validate Happy Live Flutter Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/validate-flutter-web.yml"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/validate-flutter-web.yml"

jobs:
  build-web:
    name: Flutter Web Build & Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: frontend
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Analyze code (Catch compile & type errors early)
        working-directory: frontend
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build web release
        working-directory: frontend
        run: flutter build web --release
