name: Deploy Happy Live Worker (no D1 migrations)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-happy-live-worker-only.yml"
      - "backend/worker/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: happy-live-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Worker dependencies
        working-directory: backend/worker
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Type-check Worker
        working-directory: backend/worker
        run: npm run typecheck

      - name: Run Worker tests
        working-directory: backend/worker
        run: npm test

      - name: Deploy Worker only (do not run D1 migrations)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml
