name: Deploy Happy Live Worker (no D1 migrations)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: happy-live-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Worker dependencies
        working-directory: backend/worker
        run: npm ci

      - name: Type-check Worker
        working-directory: backend/worker
        run: npm run typecheck

      - name: Run Worker tests
        working-directory: backend/worker
        run: npm test

      - name: Deploy Worker only (do not run D1 migrations)
        working-directory: backend/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml
